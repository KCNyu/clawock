<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">clawock mark</title>
  <desc id="desc">Bull and bear fields divide a Clawock decision clock along one sigmoid boundary.</desc>
  <defs>
    <linearGradient id="bull-blue" x1="16" y1="52" x2="48" y2="12" gradientUnits="userSpaceOnUse">
      <stop class="b0" offset="0"/>
      <stop class="b1" offset="1"/>
    </linearGradient>
  </defs>
  <style>
    .bear{fill:#10141a}.b0{stop-color:#245574}.b1{stop-color:#559ed1}
    @media (prefers-color-scheme:dark){
      .bear{fill:#edf2f5}.b0{stop-color:#4b91c8}.b1{stop-color:#78c5f3}
    }
  </style>
  <circle cx="32" cy="32" r="24" fill="url(#bull-blue)"/>
  <path class="bear" d="M32 8A24 24 0 0 0 32 56C17 44 47 20 32 8Z"/>
</svg>
