<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">clawock app icon</title>
  <desc id="desc">Bull and bear fields divide a Clawock decision clock along one sigmoid boundary.</desc>
  <defs>
    <linearGradient id="pearl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".48" stop-color="#f5f7f9"/>
      <stop offset="1" stop-color="#dfe5ea"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset="1" stop-color="#b8c2cb" stop-opacity=".62"/>
    </linearGradient>
    <linearGradient id="bull-blue" x1="16" y1="52" x2="48" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#245574"/>
      <stop offset="1" stop-color="#559ed1"/>
    </linearGradient>
  </defs>
  <path d="M32 2C10 2 2 10 2 32s8 30 30 30 30-8 30-30S54 2 32 2Z" fill="url(#pearl)" stroke="url(#edge)" stroke-width=".7"/>
