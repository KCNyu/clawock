<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1236" viewBox="0 0 900 1236" role="img" aria-labelledby="title desc">
  <title id="title">clawock decision operating system</title>
  <desc id="desc">A deterministic data and audit plane surrounds an LLM decision mesh, with strategy episodes, canonical-bar settlement, watchdogs, and delivery gates.</desc>
  <!--
    Authored at 900px wide, NOT 1440. GitHub renders a README image into an ~830px
    column, so a 1440px canvas is downscaled to 0.58x and every 11px label lands at
    ~6px — legible in an editor, mush in the README. At 900 the scale is ~0.92 and
    labels stay ~11px. Width is the scarce axis here; height is free, because the
    page scrolls. That is why this is three columns stacked, not five across.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset=".55" stop-color="#f3f6f9"/><stop offset="1" stop-color="#edf5fa"/>
    </linearGradient>
    <radialGradient id="haloA"><stop stop-color="#087dd1" stop-opacity=".09"/><stop offset="1" stop-color="#087dd1" stop-opacity="0"/></radialGradient>
    <radialGradient id="haloB"><stop stop-color="#8b5cf6" stop-opacity=".07"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-width=".6" opacity=".16"/></pattern>
    <linearGradient id="bus" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#087dd1"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#138b66"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation=".7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <style>
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      /* Sized for the 0.92x the README will apply — small is 12, not 11. */
      .stage{font:700 12px "SFMono-Regular",Consolas,monospace;letter-spacing:1.5px}
      .title{font:700 18px Inter,-apple-system,"Segoe UI",Arial,sans-serif}
      .body{font:500 12.5px Inter,-apple-system,"Segoe UI",Arial,sans-serif}
      .small{font:500 12px "SFMono-Regular",Consolas,monospace}
      .dim{fill:#64748b}.white{fill:#101821}
      .card{fill:#ffffff;stroke:#d8e0e8;stroke-width:1.2}
      .chip{fill:#f8fafc;stroke:#d8e0e8;stroke-width:1}
      .wire{fill:none;stroke:#788798;stroke-width:1.6;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="900" height="1236" fill="url(#bg)"/>
  <rect width="900" height="1236" fill="url(#grid)"/>
  <ellipse cx="150" cy="70" rx="360" ry="220" fill="url(#haloA)"/>
  <ellipse cx="500" cy="430" rx="420" ry="300" fill="url(#haloB)"/>

  <!-- header -->
  <g class="sans">
    <text x="30" y="52" font-size="27" font-weight="800" fill="#101821">claw<tspan fill="#087dd1">ock</tspan></text>
    <text x="30" y="76" class="mono" font-size="12" fill="#64748b" letter-spacing="1.3">DECISION OPERATING SYSTEM · HK + US</text>
    <g transform="translate(452 34)"><rect width="126" height="32" rx="16" fill="#eaf5ff" stroke="#8fc5ea"/><circle cx="17" cy="16" r="4" fill="#087dd1" filter="url(#glow)"/><text x="29" y="20" class="small" fill="#0567b1">DATA LIVE</text></g>
    <g transform="translate(588 34)"><rect width="146" height="32" rx="16" fill="#f4f0ff" stroke="#c9bdf4"/><circle cx="17" cy="16" r="4" fill="#8b5cf6" filter="url(#glow)"/><text x="29" y="20" class="small" fill="#6941c6">LLM SANDBOXED</text></g>
    <g transform="translate(744 34)"><rect width="126" height="32" rx="16" fill="#e9f8f2" stroke="#9ed8c4"/><circle cx="17" cy="16" r="4" fill="#138b66" filter="url(#glow)"/><text x="29" y="20" class="small" fill="#0d6b4e">AUDIT ON</text></g>
  </g>

  <text x="30" y="122" class="stage" fill="#64748b">01 · LIVE DECISION PIPELINE</text>
  <path d="M30 136H870" stroke="#d8e0e8"/>

  <!-- row 1: orchestrator → preflight → llm mesh -->
  <path d="M294 300H314M582 300H602" class="wire"/>

  <g transform="translate(30 158)">
    <rect class="card" width="264" height="286" rx="16"/>
    <rect width="264" height="5" rx="3" fill="#64748b"/>
    <text x="18" y="32" class="stage" fill="#94a3b8">ORCHESTRATOR</text>
    <text x="18" y="60" class="title white">Schedule + inputs</text>
    <g transform="translate(16 78)"><rect class="chip" width="232" height="44" rx="9"/><text x="14" y="19" class="small white">openclaw cron</text><text x="14" y="35" class="small dim">tracked HKT jobs</text></g>
    <g transform="translate(16 132)"><rect class="chip" width="232" height="58" rx="9"/><text x="14" y="19" class="small white">market fabric</text><text x="14" y="36" class="small dim">prices · FX · macro</text><text x="14" y="51" class="small dim">signals · news</text></g>
    <g transform="translate(16 200)"><rect class="chip" width="232" height="72" rx="9"/><text x="14" y="19" class="small white">source of truth</text><text x="14" y="36" class="small dim">portfolio.json · snapshots</text><text x="14" y="51" class="small dim">decisions.jsonl</text><text x="14" y="66" class="small dim">bars/ (canonical OHLC)</text></g>
  </g>

  <g transform="translate(318 158)">
    <rect class="card" width="264" height="286" rx="16"/>
    <rect width="264" height="5" rx="3" fill="#087dd1" filter="url(#glow)"/>
    <text x="18" y="32" class="stage" fill="#0567b1">DETERMINISTIC · PYTHON</text>
    <text x="18" y="60" class="title white">Preflight engine</text>
    <text x="18" y="80" class="body dim">Facts enter; opinions do not.</text>
    <g transform="translate(16 96)"><rect class="chip" width="232" height="44" rx="9"/><text x="14" y="19" class="small white">refresh + reconcile</text><text x="14" y="35" class="small dim">prices · FX · positions</text></g>
    <g transform="translate(16 150)"><rect class="chip" width="232" height="58" rx="9"/><text x="14" y="19" class="small white">derive risk state</text><text x="14" y="36" class="small dim">HHI · beta · regime</text><text x="14" y="51" class="small dim">hard caps · integrity</text></g>
    <g transform="translate(16 218)"><rect class="chip" width="232" height="54" rx="9"/><text x="14" y="19" class="small white">settle v2 episodes</text><text x="14" y="36" class="small dim">canonical bars · trading</text><text x="14" y="51" class="small dim">calendar · gap-aware fill</text></g>
  </g>

  <g transform="translate(606 158)">
    <rect class="card" width="264" height="286" rx="16" stroke="#6048a8"/>
    <rect width="264" height="5" rx="3" fill="#8b5cf6" filter="url(#glow)"/>
    <text x="18" y="32" class="stage" fill="#6941c6">LLM DECISION MESH</text>
    <text x="18" y="60" class="title white">Debate, then decide</text>
    <text x="18" y="80" class="body dim">Judgment only · no money math</text>
    <g transform="translate(16 96)"><rect class="chip" width="232" height="46" rx="10"/><circle cx="16" cy="17" r="4" fill="#087dd1"/><text x="29" y="21" class="small white">TIER 1 · 4 lenses</text><text x="14" y="38" class="small dim">fund · tech · sent · sector</text></g>
    <g transform="translate(16 152)"><rect class="chip" width="232" height="46" rx="10"/><circle cx="16" cy="17" r="4" fill="#f472b6"/><text x="29" y="21" class="small white">TIER 2 · BULL ↔ BEAR</text><text x="14" y="38" class="small dim">mandatory disagreement</text></g>
    <g transform="translate(16 208)"><rect class="chip" width="232" height="64" rx="10"/><circle cx="16" cy="17" r="4" fill="#8b5cf6"/><text x="29" y="21" class="small white">TIER 3 · RISK + JUDGE</text><text x="14" y="38" class="small dim">aggr · neutral · conserv</text><text x="14" y="54" class="small" fill="#6941c6">→ multi-strategy decisions[]</text></g>
  </g>

  <!-- row 2: the mesh's decisions[] flow down into the gate, then out to publish -->
  <path d="M738 450V464H234V482" class="wire"/>
  <path d="M438 588H458" class="wire"/>

  <g transform="translate(30 486)">
    <rect class="card" width="408" height="200" rx="16"/>
    <rect width="408" height="5" rx="3" fill="#138b66" filter="url(#glow)"/>
    <text x="18" y="32" class="stage" fill="#0d6b4e">DETERMINISTIC · GATE</text>
    <text x="18" y="60" class="title white">Postflight commit</text>
    <text x="18" y="80" class="body dim">The model cannot grade itself.</text>
    <g transform="translate(16 96)"><rect class="chip" width="376" height="42" rx="9"/><text x="14" y="18" class="small white">validate contract</text><text x="14" y="33" class="small dim">strategy · condition · size · shares required</text></g>
    <g transform="translate(16 146)"><rect class="chip" width="376" height="40" rx="9"/><text x="14" y="18" class="small white">assign identity</text><text x="14" y="33" class="small dim">stable ID · episode · upsert · override ledger</text></g>
  </g>

  <g transform="translate(462 486)">
    <rect class="card" width="408" height="200" rx="16"/>
    <rect width="408" height="5" rx="3" fill="#e3a640" filter="url(#glow)"/>
    <text x="18" y="32" class="stage" fill="#a66f08">PUBLISH + OBSERVE</text>
    <text x="18" y="60" class="title white">Human-facing outputs</text>
    <text x="18" y="80" class="body dim">Atomic commit · safe push · rebuild.</text>
    <g transform="translate(16 96)"><rect class="chip" width="376" height="42" rx="9"/><text x="14" y="18" class="small white">WeChat brief · Telegram fallback</text><text x="14" y="33" class="small dim">postflight is the only delivery path</text></g>
    <g transform="translate(16 146)"><rect class="chip" width="376" height="40" rx="9"/><text x="14" y="18" class="small white">public dashboard · versioned evidence</text><text x="14" y="33" class="small dim">metrics · win rate · coverage · deltas</text></g>
  </g>

  <text x="30" y="740" class="stage" fill="#64748b">02 · VERSIONED STATE + CLOSED-LOOP AUDIT</text>
  <path d="M30 754H870" stroke="#d8e0e8"/>
  <path d="M162 900V920M450 900V920M738 900V920" stroke="#64748b" stroke-width="1.4" opacity=".5"/>

  <g transform="translate(30 776)">
    <rect class="card" width="264" height="124" rx="14"/>
    <text x="16" y="26" class="stage" fill="#0567b1">MARKET STATE</text>
    <text x="16" y="52" class="small white">portfolio + snapshots</text>
    <text x="16" y="72" class="small white">bars/ · unadjusted OHLC</text>
    <text x="16" y="92" class="small dim">session-dated · immutable</text>
    <text x="16" y="110" class="small dim">atomic · reconciled</text>
    <circle cx="240" cy="26" r="4" fill="#087dd1" filter="url(#glow)"/>
  </g>

  <g transform="translate(318 776)">
    <rect class="card" width="264" height="124" rx="14"/>
    <text x="16" y="26" class="stage" fill="#6941c6">DECISION V2 LEDGER</text>
    <text x="16" y="52" class="small white">v1 migrated + native v2</text>
    <text x="16" y="72" class="small dim">stable ID · strategy episode</text>
    <text x="16" y="92" class="small dim">execution ≠ advice quality</text>
    <text x="16" y="110" class="small dim">ungradeable rows kept, not hidden</text>
    <circle cx="240" cy="26" r="4" fill="#8b5cf6" filter="url(#glow)"/>
  </g>

  <g transform="translate(606 776)">
    <rect class="card" width="264" height="124" rx="14"/>
    <text x="16" y="26" class="stage" fill="#0d6b4e">DASHBOARD STATE</text>
    <text x="16" y="52" class="small white">metrics + curves + deltas</text>
    <text x="16" y="72" class="small dim">static · public · reproducible</text>
    <text x="16" y="92" class="small dim">single publisher</text>
    <text x="16" y="110" class="small dim">no money view (see README)</text>
    <circle cx="240" cy="26" r="4" fill="#138b66" filter="url(#glow)"/>
  </g>

  <g transform="translate(30 920)">
    <rect width="840" height="106" rx="16" fill="#f4f0ff" stroke="#b9a8ed" stroke-width="1.4"/>
    <text x="18" y="28" class="stage" fill="#6941c6">PYTHON BACKTESTER / AUDITOR</text>
    <text x="18" y="54" class="body white">condition judged fired? → episode mean → next-session close</text>
    <text x="18" y="76" class="small dim">canonical bars · per-leg trading calendar · gap-aware fill · date-cluster CI · confidence vs baseline</text>
    <text x="18" y="94" class="small" fill="#0d6b4e">evidence feeds the next brief; the LLM cannot rewrite outcomes</text>
  </g>

  <text x="30" y="1076" class="stage" fill="#64748b">03 · DEFENCE IN DEPTH</text>
  <path d="M30 1090H870" stroke="#d8e0e8"/>

  <g transform="translate(30 1112)">
    <rect class="card" width="408" height="46" rx="12"/>
    <text x="16" y="20" class="stage" fill="#94a3b8">01 / PRIMARY</text>
    <text x="16" y="37" class="small dim">openclaw cron · tracked jobs</text>
  </g>
  <g transform="translate(462 1112)">
    <rect class="card" width="408" height="46" rx="12"/>
    <text x="16" y="20" class="stage" fill="#94a3b8">02 / BACKSTOP</text>
    <text x="16" y="37" class="small dim">GitHub Actions · reproducible refresh</text>
  </g>
  <g transform="translate(30 1170)">
    <rect class="card" width="408" height="46" rx="12"/>
    <text x="16" y="20" class="stage" fill="#94a3b8">03 / SUPERVISOR</text>
    <text x="16" y="37" class="small dim">watchdog · deterministic Telegram fallback</text>
  </g>
  <g transform="translate(462 1170)">
    <rect class="card" width="408" height="46" rx="12"/>
    <text x="16" y="20" class="stage" fill="#94a3b8">04 / INTEGRITY</text>
    <text x="16" y="37" class="small dim">schema · ledger · test suite · health sentinels</text>
  </g>
</svg>
