<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">How clawock turns evidence into a public investment record</title>
  <desc id="desc">Python assembles an immutable evidence pack. Independent agent lenses form bull and bear cases, three risk voices challenge them, and a judge writes a proposed strategy. Python validates the decision contract and publishes the brief, ledger, and dashboard. Canonical market bars settle every call and feed a public scorecard back into the next brief.</desc>
  <defs>
    <linearGradient id="page-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfbfc"/>
      <stop offset=".58" stop-color="#f5f6f8"/>
      <stop offset="1" stop-color="#eef2f5"/>
    </linearGradient>
    <linearGradient id="decision-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafbfc"/>
      <stop offset="1" stop-color="#edf2f6"/>
    </linearGradient>
    <linearGradient id="brand-mark" x1="9" y1="53" x2="54" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10141a"/>
      <stop offset=".58" stop-color="#2b353e"/>
      <stop offset="1" stop-color="#4b91c8"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#65798a"/>
    </marker>
    <style>
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .ink{fill:#151a21}.muted{fill:#61707e}.blue{fill:#4b83ad}.green{fill:#138b66}.warm{fill:#b8524a}
      .kicker{font:700 10.5px "SFMono-Regular",Consolas,monospace;letter-spacing:1.2px}
      .title{font:800 25px Inter,-apple-system,"Segoe UI",Arial,sans-serif;letter-spacing:-.55px}
      .stage{font:800 20px Inter,-apple-system,"Segoe UI",Arial,sans-serif;letter-spacing:-.35px}
      .body{font:500 12.5px Inter,-apple-system,"Segoe UI",Arial,sans-serif}
      .label{font:750 12px Inter,-apple-system,"Segoe UI",Arial,sans-serif}
      .micro{font:600 10.5px "SFMono-Regular",Consolas,monospace}
      .card{fill:#fff;stroke:#d8e0e8;stroke-width:1.2}
      .chip{fill:#f2f5f8;stroke:#d8e0e8;stroke-width:1}
      .wire{fill:none;stroke:#65798a;stroke-width:1.8;marker-end:url(#arrow-blue)}
    </style>
  </defs>

  <rect width="900" height="560" fill="url(#page-blue)"/>

  <g class="sans">
    <g transform="translate(20 17) scale(.34)">
      <path d="M49.8 15.9A24 24 0 1 0 49.8 48.1L44.6 43.4A17 17 0 1 1 44.6 20.6Z" fill="url(#brand-mark)"/>
      <path d="M20 23C24 23 28 32 32 32" fill="none" stroke="#1b232b" stroke-width="4.2" stroke-linecap="round"/>
      <path d="M20 41C24 41 28 32 32 32" fill="none" stroke="#687985" stroke-width="4.2" stroke-linecap="round"/>
      <path d="M32 32C36.7 32 41.3 21 46 21" fill="none" stroke="#397eae" stroke-width="4.2" stroke-linecap="round"/>
    </g>
    <text x="47" y="36" font-size="20" font-weight="800" class="ink">clawock</text>
    <text x="875" y="34" text-anchor="end" class="kicker blue">SYSTEM ARCHITECTURE · HK + US</text>

    <text x="24" y="66" class="title ink">How one claim becomes a public record</text>
    <text x="24" y="87" class="body muted">Agents may argue. They cannot rewrite facts, limits or outcomes.</text>
  </g>

  <!-- Main execution rail -->
  <path d="M204 254H222" class="wire"/>
  <path d="M588 254H606" class="wire"/>

  <!-- 01 Evidence -->
  <g transform="translate(24 108)" class="sans">
    <rect class="card" width="180" height="292" rx="15"/>
    <rect width="5" height="292" rx="2.5" fill="#6d9fc5"/>
    <text x="20" y="28" class="kicker blue">01 · PYTHON</text>
    <text x="20" y="59" class="stage ink">Evidence pack</text>
    <text x="20" y="80" class="body muted">One reconciled input.</text>

    <path d="M20 96H160" stroke="#e1e9f0"/>

    <text x="20" y="115" class="kicker blue">BOOK</text>
    <text x="20" y="133" class="label ink">holdings · cash · FX</text>

    <text x="20" y="153" class="kicker blue">MARKET</text>
    <text x="20" y="171" class="label ink">prices · regime · signals</text>

    <text x="20" y="191" class="kicker blue">RISK</text>
    <text x="20" y="209" class="label ink">exposure · caps · stops</text>

    <text x="20" y="229" class="kicker blue">EVENTS</text>
    <text x="20" y="247" class="label ink">filings · catalysts · news</text>

    <rect x="18" y="260" width="144" height="24" rx="12" fill="#e9eef2"/>
    <text x="90" y="276" text-anchor="middle" class="micro blue">IMMUTABLE CONTEXT</text>
  </g>

  <!-- 02 Agent decision room -->
  <g transform="translate(222 108)" class="sans">
    <rect width="366" height="292" rx="15" fill="url(#decision-blue)" stroke="#cbd5dd" stroke-width="1.2"/>
    <rect width="366" height="5" rx="2.5" fill="#7aa7c8"/>
    <text x="20" y="28" class="kicker blue">02 · MULTI-AGENT LLM</text>
    <text x="20" y="59" class="stage ink">Decision room</text>
    <text x="346" y="58" text-anchor="end" class="body muted">Disagreement is the feature.</text>

    <text x="20" y="91" class="kicker blue">INDEPENDENT LENSES</text>
    <g transform="translate(20 102)">
      <rect width="153" height="28" rx="7" fill="#fff" opacity=".78"/>
      <text x="76.5" y="18" text-anchor="middle" class="label ink">Fundamentals</text>
      <rect x="173" width="153" height="28" rx="7" fill="#fff" opacity=".78"/>
      <text x="249.5" y="18" text-anchor="middle" class="label ink">Market + quant</text>
      <rect y="36" width="153" height="28" rx="7" fill="#fff" opacity=".78"/>
      <text x="76.5" y="54" text-anchor="middle" class="label ink">Sentiment + events</text>
      <rect x="173" y="36" width="153" height="28" rx="7" fill="#fff" opacity=".78"/>
      <text x="249.5" y="54" text-anchor="middle" class="label ink">Cross-market</text>
    </g>

    <text x="20" y="185" class="kicker blue">FORCED CONTEST</text>
    <rect x="20" y="196" width="136" height="31" rx="8" fill="#e8f6f1" stroke="#c9e7dc"/>
    <text x="88" y="216" text-anchor="middle" class="label green">BULL CASE</text>
    <text x="183" y="216" text-anchor="middle" class="kicker blue">VS</text>
    <rect x="210" y="196" width="136" height="31" rx="8" fill="#fff0ef" stroke="#f0d1cf"/>
    <text x="278" y="216" text-anchor="middle" class="label warm">BEAR CASE</text>

    <text x="20" y="242" class="kicker blue">RISK VOICES</text>
    <text x="116" y="242" class="micro ink">AGGRESSIVE</text>
    <circle cx="187" cy="238" r="2.5" fill="#7aa7c8"/>
    <text x="199" y="242" class="micro ink">NEUTRAL</text>
    <circle cx="251" cy="238" r="2.5" fill="#7aa7c8"/>
    <text x="263" y="242" class="micro ink">CONSERVATIVE</text>

    <rect x="20" y="251" width="326" height="34" rx="9" fill="#26323d"/>
    <text x="35" y="265" class="kicker" fill="#c8d9e6">JUDGE</text>
    <text x="35" y="279" class="micro" fill="#fff">strategy + action + trigger + confidence</text>
  </g>

  <!-- 03 Deterministic decision contract -->
  <g transform="translate(606 108)" class="sans">
    <rect class="card" width="270" height="292" rx="15"/>
    <rect width="5" height="292" rx="2.5" fill="#6d9fc5"/>
    <text x="20" y="28" class="kicker blue">03 · PYTHON CODE GATE</text>
    <text x="20" y="59" class="stage ink">Decision contract</text>
    <text x="20" y="80" class="body muted">Only valid records get published.</text>

    <path d="M20 96H250" stroke="#e1e9f0"/>

    <circle cx="31" cy="122" r="11" fill="#e9eef2"/>
    <path d="M26 122l3 3 6-7" fill="none" stroke="#4b83ad" stroke-width="1.8"/>
    <text x="51" y="120" class="label ink">Validate required fields</text>
    <text x="51" y="137" class="micro muted">condition · size · rationale</text>

    <circle cx="31" cy="166" r="11" fill="#f5e6dd"/>
    <path d="M31 159v8M31 171v1" stroke="#b95f3a" stroke-width="1.8"/>
    <text x="51" y="164" class="label ink">Require hard-limit actions</text>
    <text x="51" y="181" class="micro muted">reject omitted risk breaches</text>

    <circle cx="31" cy="210" r="11" fill="#e9eef2"/>
    <text x="31" y="214" text-anchor="middle" class="micro blue">#</text>
    <text x="51" y="208" class="label ink">Assign stable identity</text>
    <text x="51" y="225" class="micro muted">strategy · decision · episode</text>

    <text x="20" y="250" class="kicker blue">VERSIONED OUTPUT</text>
    <g transform="translate(20 260)">
      <rect class="chip" width="68" height="27" rx="7"/>
      <text x="34" y="18" text-anchor="middle" class="micro ink">BRIEF</text>
      <rect x="76" class="chip" width="76" height="27" rx="7"/>
      <text x="114" y="18" text-anchor="middle" class="micro ink">LEDGER</text>
      <rect x="160" class="chip" width="90" height="27" rx="7"/>
      <text x="205" y="18" text-anchor="middle" class="micro ink">DASHBOARD</text>
    </g>
  </g>

  <!-- Evidence loop -->
  <g class="sans">
    <text x="24" y="426" class="kicker blue">THE SYSTEM HAS TO FACE ITS OWN RECORD</text>
    <text x="876" y="426" text-anchor="end" class="micro muted">no model edits after publication</text>

    <rect x="24" y="442" width="852" height="90" rx="15" fill="#fff" stroke="#d8e0e8" stroke-width="1.2"/>
    <path d="M225 487H257" class="wire"/>
    <path d="M465 487H497" class="wire"/>
    <path d="M697 487H729" class="wire"/>

    <circle cx="51" cy="487" r="17" fill="#e9eef2"/>
    <path d="M43 487h16M51 479v16" stroke="#5d7487" stroke-width="1.6"/>
    <text x="78" y="482" class="kicker blue">CANONICAL BARS</text>
    <text x="78" y="501" class="body muted">session-dated truth</text>

    <circle cx="284" cy="487" r="17" fill="#e9eef2"/>
    <path d="M277 487h14M284 480v14" stroke="#5d7487" stroke-width="1.6"/>
    <text x="311" y="482" class="kicker blue">SETTLE + GRADE</text>
    <text x="311" y="501" class="body muted">episodes · timing · calibration</text>

    <circle cx="524" cy="487" r="17" fill="#e9eef2"/>
    <path d="M517 491l4-5 4 3 7-9" fill="none" stroke="#5d7487" stroke-width="1.6"/>
    <text x="551" y="482" class="kicker blue">PUBLIC SCORECARD</text>
    <text x="551" y="501" class="body muted">outcomes + coverage</text>

    <rect x="736" y="467" width="122" height="40" rx="20" fill="#26323d"/>
    <text x="797" y="483" text-anchor="middle" class="kicker" fill="#c8d9e6">FEEDBACK</text>
    <text x="797" y="498" text-anchor="middle" class="micro" fill="#fff">↺ NEXT BRIEF</text>
  </g>
</svg>
