# The one place for which models exist, how they are configured, and which
# scenario uses which. Everything model-related in OpenClaw, the cron contract,
# clawock's own MiniMax client and the dsh profiles is generated from here.
#
#   python3 ops/host/sync_models.py            # check: what differs from this file
#   python3 ops/host/sync_models.py --apply    # write it (restarts nothing; prints what to restart)
#   python3 ops/host/sync_models.py --effective
#
# Field names inside [providers.*] and [models.*] are OpenClaw's own and are
# copied through unchanged, so any OpenClaw option can be set here. Keys never
# live here: apiKey and other credentials stay in ~/.openclaw/openclaw.json.

# ── Providers ────────────────────────────────────────────────────────────────

[providers.minimax]
baseUrl = "https://api.minimaxi.com/anthropic"
api = "anthropic-messages"
authHeader = true
timeoutSeconds = 300
# Same account under a second name: the second hop is a retry, not a backup.
aliases = ["minimax-2"]

[providers.deepseek]
baseUrl = "https://api.deepseek.com"
api = "openai-completions"
authHeader = true
timeoutSeconds = 300

[providers.anthropic]
baseUrl = "https://api.anthropic.com"
api = "anthropic-messages"

# The local Codex login (ChatGPT subscription); no endpoint or key here.
[providers.openai]

# ── Models ───────────────────────────────────────────────────────────────────
# `ref` is provider/id. `params` and `runtime` become OpenClaw's per-model
# defaults; everything else is the provider model-table entry.
#
# MiniMax: only MiniMax-M3.1-Flash is used (kcn, 2026-10-20). Per MiniMax's
# Anthropic API reference (platform.minimax.cn/docs/api-reference/text-anthropic-api,
# "Thinking 控制" and "思考深度控制"), its thinking is always on: omitted or
# `{"type": "adaptive"}` both think, `disabled` is HTTP 400. Depth is a separate
# knob, `output_config.effort` = low | medium | high | xhigh | max, default max
# when omitted. In OpenClaw's level vocabulary that leaves exactly `adaptive`.

[models.flash]
ref = "minimax/MiniMax-M3.1-Flash"
name = "MiniMax M3.1 Flash"
contextWindow = 1048576
maxTokens = 131072
input = ["text"]
reasoning = true
params = { thinking = "adaptive" }

[models.deepseek]
ref = "deepseek/deepseek-flash"
name = "DeepSeek V4.1 Flash 1017 (direct)"
reasoning = true
input = ["text", "image"]
contextWindow = 1048576
maxTokens = 393216
cost = { input = 0.3, output = 1.2, cacheRead = 0.006, cacheWrite = 0 }
compat = { supportsUsageInStreaming = true, supportsReasoningEffort = true, maxTokensField = "max_tokens" }
params = { contextTokens = 1048576, maxTokens = 393216 }

[models.deepseek-pro]
ref = "deepseek/deepseek-v4-pro"
name = "DeepSeek V4 Pro (direct)"
reasoning = true
input = ["text"]
contextWindow = 1048576
maxTokens = 393216
cost = { input = 1.32, output = 3.96, cacheRead = 0.044, cacheWrite = 0 }
compat = { supportsUsageInStreaming = true, supportsReasoningEffort = true, maxTokensField = "max_tokens" }
params = { contextTokens = 1048576, maxTokens = 393216 }

[models.sol]
ref = "openai/gpt-6.1-sol"
name = "GPT-6.1-Sol"
reasoning = true
input = ["text", "image"]
contextWindow = 272000
maxTokens = 128000
cost = { input = 0, output = 0, cacheRead = 0, cacheWrite = 0 }
compat = { supportsReasoningEffort = true, supportedReasoningEfforts = ["low", "medium", "high", "xhigh", "max", "ultra"] }
runtime = "codex"
params = { thinking = "medium" }

[models.luna]
ref = "openai/gpt-6-luna"
name = "GPT-6-Luna"
reasoning = true
input = ["text", "image"]
contextWindow = 272000
maxTokens = 128000
cost = { input = 0, output = 0, cacheRead = 0, cacheWrite = 0 }
compat = { supportsReasoningEffort = true, supportedReasoningEfforts = ["low", "medium", "high", "xhigh", "max"] }
runtime = "codex"
# Dreaming's fallback is Luna at max; explicit chain thinking still wins.
params = { thinking = "max" }

[models.sonnet]
ref = "anthropic/claude-sonnet-5-5"
name = "Claude Sonnet 5.5"
contextWindow = 1000000
maxTokens = 128000
input = ["text"]
runtime = "claude-cli"

# ── Chains: which scenario uses which models ─────────────────────────────────
# `models` is the rotation, first = primary. `name@alias` runs that model under
# a provider alias. `also_allowed` may be swapped in by hand without a contract
# change. `thinking` is the scenario's level for the whole turn: OpenClaw resolves
# it once and clamps it per fallback candidate to a level that model has, with
# a warning. A chain without `thinking` takes each model's `params.thinking`.

[chains.chat]  # direct chat with the assistant
models = ["flash", "deepseek"]

[chains.heartbeat]
models = ["flash"]

[chains.subagents]
models = ["flash"]

[chains.dreaming]  # memory-core dreaming and its subagent allowlist
# Keep MiniMax primary; use the Codex runtime only when it fails.
models = ["flash", "luna"]

[chains.cron]  # strategy crons: report / intraday / brief
models = ["flash", "flash@minimax-2", "luna"]
also_allowed = ["sol"]
# One level serves the MiniMax hops and Luna, and they share no level but off.
# `max` is Luna's top (kcn 2026-09-13: Luna max as the backstop); on the MiniMax
# hops OpenClaw clamps it to `adaptive` and sends no effort, which the endpoint
# runs at its default `max`. `adaptive` here would clamp Luna to `medium`.
thinking = "max"

[chains.memory-cron]  # Memory Dreaming Promotion
models = ["flash"]

# clawock's own MiniMax client (src/clawock/automation/llm.py)
[chains.clawock-llm]
models = ["flash"]

# ── OpenClaw-wide settings ───────────────────────────────────────────────────
# Copied into ~/.openclaw/openclaw.json at the same path. Values not listed here
# stay hand-set on the host.

[openclaw.agents.defaults]
# The level for a model without `params.thinking`: deepseek (chat fallback),
# sonnet. MiniMax-M3.1-Flash and Luna have their own above.
thinkingDefault = "high"

[openclaw.talk]
# Talk consults run the chat chain, MiniMax-M3.1-Flash first.
consultThinkingLevel = "adaptive"
