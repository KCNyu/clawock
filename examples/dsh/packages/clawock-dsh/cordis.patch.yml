# clawock-dsh patch layer: one read-only Remote gateway row feeding the
# Decision Studio conversation-view tab. The row's package (clawock-dsh) is
# resolved from the profile's node_modules after `dsh plugin --profile web
# add clawock-dsh`.
- insert:
    - id: clawock-studio
      name: clawock-dsh
      # The gateway's balance reading (sidebar foot) resolves each provider's key through the
      # credentials seam; the row must declare the service so the profile
      # mixes it into the plugin context (ctx.credentials).
      inject: [credentials]
      # Optional balance-chip overrides (defaults shown). The row config reaches
      # the gateway's constructor; a change takes effect on the next dsh restart.
      # config:
      #   balanceBaseUrl: 'https://api.deepseek.com'   # DeepSeek upstream root
      #   balanceThreshold: 20                         # red dot at/below this (CNY/USD)
      #   balanceRefreshMs: 60000                      # suggested poll interval (min 60s)
      #   minimaxBaseUrl: 'https://api.minimaxi.com'   # MiniMax upstream root
      #   minimaxKeyRef: 'MINIMAX_API_KEY'             # credentials seam ref (env fallback same name)
      #   minimaxLowPct: 20                            # red dot when quota windows <= this remaining %
      #   minimaxOpenclawConfigPath: '~/.openclaw/openclaw.json'      # key fallback: models.providers.minimax.apiKey
      #   claudeCredentialsPath: '~/.claude/.credentials.json'        # Claude Code OAuth file (read-only)
      #   claudeUsageUrl: 'https://api.anthropic.com/api/oauth/usage' # subscription quota endpoint
      #   claudeLowPct: 20                             # red dot when the session window <= this remaining %
      #   codexCommand: '~/.local/bin/codex'           # official Codex CLI app-server executable
      #   codexLowPct: 20                              # red dot when a quota window <= this remaining %
      #   codexRefreshMs: 300000                       # app-server poll/cache cadence (default 5 min)
      #   dispatchLogDir: '~/logs/agent-dispatch'      # task chip data; the chip hides without it
      #   dispatchLimitsPath: '~/tools/agent-dispatch/limits.env'  # MAX_RUNNING for the slot count
      #   patrolStateDir: '~/logs/clawock-patrol'      # current-round, rounds.tsv
      #   taskQueueRefreshMs: 15000                    # suggested task-chip poll interval
      #   taskQueueRecent: 5                           # recently ended tasks listed
