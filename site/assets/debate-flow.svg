<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1016" height="811" viewBox="0 0 1016 811" role="img" aria-labelledby="title desc">
  <title id="title">The debate: both sides read the same evidence, and the resolution is attributed</title>
  <desc id="desc">One real debate, Goldwind on 2026-10-08. Four analyst lenses read one evidence pack. A bull case and a bear case cite the same two pieces of evidence: the leveraged exposure of the Hong Kong book and the distance from the 200-day average. The bear must name the consensus it attacks. Three risk voices follow, aggressive, conservative and neutral, and a judge names the frame behind the call, relative strength, and writes the plan: watch, act only above 8.97, dead at 8.923, confidence 0.34, marked contested. Without an opposing case that cites evidence, publication is refused.</desc>
