<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="520" height="1296" viewBox="0 0 520 1296" role="img" aria-labelledby="title desc">
  <title id="title">Inside the clawock multi-agent debate</title>
  <desc id="desc">A pipeline. One shared evidence pack feeds four analyst lenses that merge into a single table. Two researchers are asked to argue opposing bull and bear cases and to record where they disagree, so unanimous agreement reads as a flag. Three risk voices then stress every call and a judge names the strategy frame driving each decision, resolving the argument into plan.json — which enters the next session's grading pipeline, where code, not the model, settles the score.</desc>
