  <title id="title">Feedback: a live learning wheel and a portable adoption state machine</title>
  <desc id="desc">Left: a live loop connects execution evidence, canonical-bar episodes, history and earlier-date calibration back to the next brief. Right: portable source-linked outcome and directional evaluation can trigger a bounded proposal; exact-hash named review accepts or rejects it, accepted changes apply with rollback records. Only evidence/provenance strictness changes, not strategy. Neither path promises returns.</desc>
