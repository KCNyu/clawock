<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="520" height="1407" viewBox="0 0 520 1407" role="img" aria-labelledby="title desc">
  <title id="title">What clawock code enforces</title>
  <desc id="desc">The model writes opinions; the limits are code. Risk caps are checked in every brief: a leveraged single name at most 35 percent, a non-leveraged core name at most 60 percent with a 35 to 60 percent review band, a correlated cluster at most 70 percent, the leverage-ETF sleeve at most 50 percent, portfolio beta at most 3.0 and a stop at minus 18 percent. Money rules: US dollars and Hong Kong dollars never sum, the book must reconcile before anything is pushed, and return is measured on peak principal. Evidence rules: an add needs two independent evidence families, a thesis moves only on new evidence and never on price alone, a published research number needs two sources, and a decision without a bear case is rejected. Execution stays human.</desc>
