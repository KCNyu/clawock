  <text x="24" y="46" class="kick"><tspan fill="#3f82b5">GUARDRAILS · A CODE CONTROL PANEL</tspan></text>
  <text x="24" y="80" class="title"><tspan fill="#151a21">The model proposes.</tspan></text>
  <text x="24" y="114" class="title"><tspan fill="#151a21">Code holds the boundary.</tspan></text>
  <text x="24" y="150" class="sub"><tspan fill="#5b6875">Limits, ledger identities and evidence requirements</tspan></text>
  <text x="24" y="171" class="sub"><tspan fill="#5b6875">are different controls, checked together.</tspan></text>
