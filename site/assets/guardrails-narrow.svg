  <g class="hero-icon" data-icon="checks" transform="translate(42 1113) scale(0.75)" fill="none" stroke="#3f82b5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 8l2 2 3-4m2 3h3M7 16l2 2 3-4m2 3h3"/></g>
  <text x="72" y="1128" class="m"><tspan fill="#5b6875">A thesis moves on new evidence, not price</tspan></text>
  <g class="hero-icon" data-icon="checks" transform="translate(42 1155) scale(0.75)" fill="none" stroke="#3f82b5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 8l2 2 3-4m2 3h3M7 16l2 2 3-4m2 3h3"/></g>
  <text x="72" y="1170" class="m"><tspan fill="#5b6875">A published number needs two sources</tspan></text>
  <g class="hero-icon" data-icon="checks" transform="translate(42 1197) scale(0.75)" fill="none" stroke="#3f82b5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 8l2 2 3-4m2 3h3M7 16l2 2 3-4m2 3h3"/></g>
  <text x="72" y="1212" class="m"><tspan fill="#5b6875">No bear case, no publication</tspan></text>
  <text x="44" y="1314" class="m"><tspan fill="#5b6875">Risk it cannot compute prints “risk unavailable”, never</tspan></text>
  <text x="44" y="1337" class="m"><tspan fill="#5b6875">a green “none”.</tspan></text>
  <text x="44" y="1360" class="m"><tspan fill="#5b6875">Execution stays human.</tspan></text>
