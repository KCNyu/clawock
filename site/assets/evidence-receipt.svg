  <title id="title">Evidence matrix: source, output, check</title>
  <desc id="desc">Eight information families as a matrix, not a sequential feed: market, filings, flow, news, macro/sentiment, quant/risk, book/FX and backtest/calibration. Each source maps to an output and a check. Source provenance is distinct from content certification; context and pack hashes identify input, not truth. Credentials stay with the runtime.</desc>
