  <text x="24" y="46" class="kick"><tspan fill="#3f82b5">INFORMATION · THE SOURCE MATRIX</tspan></text>
  <text x="24" y="80" class="title"><tspan fill="#151a21">Many sources.</tspan></text>
  <text x="24" y="114" class="title"><tspan fill="#151a21">One traceable context.</tspan></text>
  <text x="24" y="150" class="sub"><tspan fill="#5b6875">Read across: information family → source → usable output.</tspan></text>
  <text x="24" y="171" class="sub"><tspan fill="#5b6875">Missing or stale evidence stays labelled.</tspan></text>
