  <title id="title">What clawock code enforces</title>
  <desc id="desc">Risk limits, not current exposures. Source: src/clawock/portfolio/guardrail.py:GUARDRAIL_CAPS. Leveraged name: ≤ 35%; Core name: ≤ 60% / review 35%; Correlated cluster: ≤ 70%; Leverage ETFs: ≤ 50%; US portfolio beta: ≤ 3.0; ETF stop vs cost: −18%. Core review is advisory; a breach freezes same-risk adds until compliance. Currencies remain separate, the book reconciles before push, sources support numbers and a bear case is required. Execution stays human.</desc>
