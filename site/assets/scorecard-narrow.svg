<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="520" height="1582" viewBox="0 0 520 1582" role="img" aria-labelledby="title desc">
  <title id="title">How clawock grades a call</title>
  <desc id="desc">The model writes a versioned decision with its strategy, condition, regime, size and confidence into memory/decisions.jsonl. From there the model has no write access. Python evaluates the trigger against canonical unadjusted daily bars on each market's own calendar; an unfinished session grades nothing and a gap through a trigger fills at the open. Repeated calls on one thesis collapse into one episode. Code settles the outcome and scores it against a plain directional baseline, then publishes wins, losses and the cases that cannot be graded, which stay visible and out of the win-rate denominator. The record is a diagnostic, not proof of return.</desc>
