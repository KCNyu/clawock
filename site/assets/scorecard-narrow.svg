  <text x="24" y="46" class="kick"><tspan fill="#3f82b5">SCORECARD · A SETTLEMENT STATE MACHINE</tspan></text>
  <text x="24" y="80" class="title"><tspan fill="#151a21">One recorded call.</tspan></text>
  <text x="24" y="114" class="title"><tspan fill="#151a21">Every possible verdict stays.</tspan></text>
  <text x="24" y="150" class="sub"><tspan fill="#5b6875">Separate a model opinion from code-owned settlement.</tspan></text>
  <text x="24" y="171" class="sub"><tspan fill="#5b6875">Incomplete evidence stays visible as a state.</tspan></text>
