<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1016" height="731" viewBox="0 0 1016 731" role="img" aria-labelledby="title desc">
  <title id="title">Where to start with clawock</title>
  <desc id="desc">Three readers and where each one starts. If you trade your own Hong Kong and US book, you get a plan before the open, cards through the session and a grade after the close, and you start with clawock init. If you already run an agent such as Claude Code, Codex, OpenClaw or DeepSeek Harness, you install the investment-decision workflow and your agent keeps the model call. If you want to see the record first, the live dashboard shows every call settled by code with the losses included. Underneath all three sits one contract: certified evidence, a required opposing case, checked money arithmetic and an outcome linked back to the decision.</desc>
