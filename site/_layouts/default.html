<!DOCTYPE html>
<html lang="{{ page.lang | default: 'zh-CN' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f8fb" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/icons/app-icon.svg' | relative_url }}">
<link rel="icon" type="image/png" sizes="64x64" href="{{ '/assets/icons/favicon-64.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/icons/apple-touch-icon.png' | relative_url }}">
{% seo %}
<style>
  /* Match dashboard v2 design tokens (self-contained, no external CSS) */
  :root {
    color-scheme: dark light;
    --bg: #0a0e1a;
    --card: #131929;
    --card-2: #1a2236;
    --border: #232b40;
    --text: #e8eaf0;
    --text-dim: #98a0b4;
    --accent: #5b8def;
    --accent-2: #a78bfa;
    --green: #34d399;
    --red: #f87171;
    --radius: 12px;
    --radius-sm: 8px;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    /* Brief cards (2026-09-11): the lit top edge and the drop shadow are the
       two halves of "a card sitting on the page", and each needs its own value
       per theme — a white edge vanishes on a white card, a soft shadow vanishes
       on a near-black page. Tokens, not literals, for the #1272 reason. */
    --card-edge: rgba(255, 255, 255, 0.05);
    --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.30), 0 14px 32px -18px rgba(0, 0, 0, 0.70);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f8fb;
      --card: #ffffff;
      --card-2: #f0f3f9;
      --border: #e3e7f0;
      --text: #0f1626;
      --text-dim: #5b6478;
      --accent: #3b6cdb;
      --accent-2: #7c5ce8;
      --green: #16a34a;
      --red: #dc2626;
      --card-edge: rgba(255, 255, 255, 0.9);
      --card-shadow: 0 1px 2px rgba(15, 22, 38, 0.05), 0 14px 32px -20px rgba(15, 22, 38, 0.22);
    }
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text); margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 15px; line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 40px;
  }

  /* Sticky topbar — single row, no icon stack */
  header.topbar {
    position: sticky; top: 0; z-index: 30;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    backdrop-filter: blur(8px);
  }
  .topbar-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; max-width: 980px; margin: 0 auto;
  }
  .brand {
    display: flex; align-items: center; gap: 8px; min-width: 0; text-decoration: none;
  }
  .brand-mark { width: 24px; height: 24px; flex: 0 0 auto; display: block; }
  .brand h1 { margin: 0; font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; }
  .brand .tag { font-size: 11px; color: var(--text-dim); }
  .topbar-actions { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .nav-link {
    color: var(--text-dim); text-decoration: none; font-size: 13px;
    padding: 6px 10px; border-radius: 6px; transition: background 0.15s, color 0.15s;
  }
  .nav-link:hover { color: var(--text); background: var(--card-2); }
  .nav-link.active { color: var(--accent); background: var(--card-2); }
  /* Below this width the brand and five links stop fitting on one line. At
     375px they come to roughly 382px, so `flex-wrap` broke the nav onto a
     second line and `justify-content: space-between` then shoved that line
     against the right edge — a ragged two-row header on every phone. Giving the
     nav its own full-width row is the same information in a shape a phone can
     hold. `nowrap` + `overflow-x: auto` is the safety valve: on a 320px screen,
     or the day a sixth link is added, the failure mode is a scroll rather than
     another ragged wrap. */
  @media (max-width: 600px) {
    header.topbar { padding: 8px 12px; }
    .topbar-row { flex-wrap: wrap; row-gap: 4px; }
    .brand { flex: 1 1 auto; }
    .topbar-actions {
      flex: 1 0 100%;
      flex-wrap: nowrap;
      justify-content: space-between;
      overflow-x: auto;
      scrollbar-width: none;
      /* Bleed to the header's own padding so the first and last link sit flush
         with the content below them instead of inside a phantom inset. */
      margin: 0 -12px; padding: 0 12px; gap: 2px;
    }
    .topbar-actions::-webkit-scrollbar { display: none; }
    /* A touch target, not a mouse target: 12.5px text with 8px of vertical
       padding is ~37px tall, against the ~30px this row used to be. */
    .nav-link { flex: 0 0 auto; padding: 8px 9px; font-size: 12.5px; }
  }
  @media (max-width: 480px) {
    .brand-mark { width: 22px; height: 22px; }
    .brand h1 { font-size: 16px; }
    .brand .tag { display: none; }
  }

  /* Article */
  main {
    max-width: 1024px; margin: 0 auto; padding: 24px 16px;
  }
  article {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }
  @media (max-width: 480px) {
    main { padding: 16px 12px; }
    article { padding: 18px; border-radius: var(--radius-sm); }
  }

  /* Typography for rendered brief content */
  article h1 { font-size: 22px; margin: 0 0 14px; line-height: 1.3; letter-spacing: -0.01em; }

  /* Two heading levels, two jobs (2026-09-06). The brief used to be twenty flat
     `h2`s, and the rule-above-every-h2 rendering turned it into twenty
     equally-weighted slabs with nothing saying which one was the decision. It is
     now four `h2` parts with `h3` subsections inside them, so the weight
     difference has to be visible: the part is a titled band, the subsection is a
     quiet label. */
  article h2 {
    font-size: 17px; font-weight: 650; margin: 30px 0 14px; padding: 10px 14px;
    color: var(--text); letter-spacing: -0.01em;
    background: linear-gradient(180deg, var(--card-2), transparent 140%);
    border-left: 3px solid var(--accent);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  }
  article h2:first-of-type { margin-top: 22px; }
  article h3 {
    font-size: 13px; font-weight: 600; margin: 22px 0 8px;
    color: var(--text-dim); text-transform: none;
    letter-spacing: 0.02em;
  }
  /* A hairline that starts at the text rather than a full rule: it separates
     subsections without competing with the part bands above them. */
  article h3::after {
    content: ""; display: block; margin-top: 6px;
    height: 1px; background: var(--border);
  }
  article h2 + h3 { margin-top: 4px; }
  article p { margin: 10px 0; }

  /* The reference material the brief folds away. Closed by default is the whole
     point — the page opens on the call, not on the book. */
  article details.brief-appendix {
    margin: 30px 0 0; border: 1px solid var(--border);
    border-radius: var(--radius-sm); background: var(--card-2);
    padding: 0 14px;
  }
  article details.brief-appendix > summary {
    cursor: pointer; list-style: none; padding: 12px 0;
    font-size: 13px; font-weight: 600; color: var(--text-dim);
    display: flex; align-items: center; gap: 8px;
  }
  article details.brief-appendix > summary::-webkit-details-marker { display: none; }
  article details.brief-appendix > summary::before {
    content: "▸"; color: var(--accent); font-size: 11px;
    transition: transform 0.15s ease;
  }
  article details.brief-appendix[open] > summary::before { transform: rotate(90deg); }
  article details.brief-appendix > summary:hover { color: var(--text); }
  article details.brief-appendix > summary:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px;
  }
  article details.brief-appendix[open] > summary { border-bottom: 1px solid var(--border); }
  article details.brief-appendix > *:last-child { margin-bottom: 14px; }
  @media (prefers-reduced-motion: reduce) {
    article details.brief-appendix > summary::before { transition: none; }
  }
  article ul, article ol { margin: 8px 0; padding-left: 22px; }
  article li { margin: 4px 0; }
  article code {
    font-family: var(--mono); font-size: 13px;
    background: var(--card-2); padding: 1px 5px; border-radius: 4px;
  }
  article pre {
    background: var(--card-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 12px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; line-height: 1.5;
  }
  article pre code { background: transparent; padding: 0; }
  article blockquote {
    border-left: 3px solid var(--accent); padding: 4px 12px; margin: 12px 0;
    color: var(--text-dim); background: var(--card-2); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  }
  article a { color: var(--accent); text-decoration: none; }
  article a:hover { text-decoration: underline; }
  article table {
    width: 100%; border-collapse: collapse; margin: 12px 0;
    font-variant-numeric: tabular-nums; font-size: 13.5px;
  }
  article table th, article table td {
    padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: left;
  }
  article table th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); }
  article hr { border: 0; border-top: 1px solid var(--border); margin: 20px 0; }
  /* Verdict badges in the brief's Confidence table (#1272). The glyph is
     rendered by `brief_render.verdict_badge` and carries the signal on
     surfaces that strip this class (GitHub's markdown sanitiser); here the
     class adds the theme-correct tint, so the column reads at a glance. */
  article .verdict { font-weight: 600; white-space: nowrap; }
  article .verdict-bullish { color: var(--green); }
  article .verdict-bearish { color: var(--red); }
  article .verdict-neutral { color: var(--text-dim); }
  article .verdict-mixed   { color: var(--accent-2); }

  /* Mobile: 宽表(如 7 列持仓表)横向滚动而非溢出撑破布局 */
  @media (max-width: 600px) {
    article table {
      display: block; width: 100%; overflow-x: auto;
      -webkit-overflow-scrolling: touch; white-space: nowrap; font-size: 12px;
    }
    article table th, article table td { padding: 6px 8px; }
  }

  /* ── Brief pages: one card per subsection (2026-09-11) ────────────────────
     kcn: "在 dashboard 里看 brief 也很丑，也没什么卡片区块感，数据排版也很杂乱".
     Measured on the 2026-09-11 brief before this change: zero containers below
     the part bands (every `h3` subsection was a quiet label with a hairline,
     `background: transparent`, `border: 0`), five of sixteen tables carrying a
     prose column with cells up to 668 characters, and — under the phone rule's
     `nowrap` — a 4,880px table inside a 328px screen.

     `brief_render` now wraps each subsection in `.brief-card` and lays the five
     prose tables out as `.brief-entries`. Everything below is scoped to
     `article:has(.brief-card)`, so the weekly reviews, the FAQ and every other
     page on this layout keep the single-panel look they were designed with; a
     brief rendered before this change has no cards and also keeps it. */
  article:has(.brief-card) {
    background: transparent; border: 0; padding: 0;
  }
  article:has(.brief-card) > h1 { margin: 6px 2px 14px; font-size: 24px; }
  /* Parts become section headers ON the page, between groups of cards — the
     cards carry the weight now, so the band would be a card-shaped thing that
     is not a card. */
  article:has(.brief-card) h2 {
    background: none; border-left: 0; border-radius: 0;
    padding: 0 2px; margin: 34px 0 10px;
    font-size: 18px; font-weight: 700;
    display: flex; align-items: center; gap: 10px;
  }
  article:has(.brief-card) h2::before {
    content: ""; flex: 0 0 auto; width: 4px; height: 1.05em;
    border-radius: 2px; background: var(--accent);
  }
  .brief-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin: 12px 0;
    box-shadow: inset 0 1px 0 var(--card-edge), var(--card-shadow);
  }
  .brief-card > :first-child { margin-top: 0; }
  .brief-card > :last-child { margin-bottom: 0; }
  article .brief-card > h3 {
    font-size: 15px; font-weight: 650; color: var(--text);
    letter-spacing: -0.005em; margin: 0 0 12px;
  }
  article .brief-card > h3::after { display: none; }
  /* The opening call: the first thing the page says, set a size up. */
  .brief-lede { font-size: 15.5px; line-height: 1.7; }
  .brief-lede > p { margin: 8px 0; }

  /* One block per row for the rows whose content is prose. */
  .brief-entries > ul {
    list-style: none; padding: 0; margin: 0;
    display: grid; gap: 10px;
  }
  article .brief-entries li {
    margin: 0; padding: 12px 14px;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }
  .brief-entries li > p { margin: 6px 0 0; }
  .brief-entries li > p:first-child { margin: 0; font-size: 15px; line-height: 1.5; }
  .brief-entries .entry-meta {
    display: block; font-family: var(--mono); font-size: 12px;
    line-height: 1.5; color: var(--text-dim); overflow-wrap: anywhere;
  }
  /* The field label (理由 / 证伪条件 / Fundamentals …) reads as a label, so the
     prose after it is what the eye lands on. */
  .brief-entries li > p:not(:first-child) > strong:first-child {
    color: var(--text-dim); font-size: 12.5px; font-weight: 600;
    letter-spacing: 0.02em;
  }
  /* In 今日动作 the title is `**ticker** · **action**`: the second bold is the
     call itself, so it reads as a chip. Only that section has a second bold in
     its title line, which is the renderer's doing, not an accident. */
  .brief-entries li > p:first-child > strong:nth-of-type(2) {
    display: inline-block; padding: 0 9px; border-radius: 999px;
    font-size: 13px; line-height: 1.7; vertical-align: 1px;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, transparent);
  }

  .brief-card table { margin: 4px 0; }
  .brief-card > table:last-child { margin-bottom: 0; }

  /* The folded reference material: the toggle becomes a card of its own and
     the sections inside it stay cards, instead of cards nested in a panel. */
  article:has(.brief-card) details.brief-appendix {
    background: transparent; border: 0; padding: 0; margin-top: 34px;
  }
  article:has(.brief-card) details.brief-appendix > summary {
    padding: 13px 18px; background: var(--card);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: inset 0 1px 0 var(--card-edge), var(--card-shadow);
  }
  article:has(.brief-card) details.brief-appendix[open] > summary {
    border-bottom: 1px solid var(--border); margin-bottom: 4px;
  }

  @media (max-width: 600px) {
    article:has(.brief-card) { padding: 0; }
    article:has(.brief-card) > h1 { font-size: 20px; }
    .brief-card { padding: 14px; margin: 10px 0; border-radius: var(--radius-sm); }
    article .brief-entries li { padding: 10px 12px; }
    /* Cells wrap on brief pages. `nowrap` (below, for every page) was there so
       a wide numeric table scrolls instead of breaking the layout — the scroll
       still happens via `display: block; overflow-x: auto`, and with prose out
       of the tables a wrapped cell is a number and a word, not 668 characters
       on one line. Headers keep `nowrap` so a column name never splits. */
    article:has(.brief-card) table { white-space: normal; }
    article:has(.brief-card) table th { white-space: nowrap; }

    /* On a phone the call has to be visible before the reasoning (the 09-09
       rule: what matters must be seen without a second action). Nine
       decisions with ~500 characters of reasoning each made 今日动作 4,249px
       tall at 390px, so the prose fields clamp to two lines and a tap opens the
       entry. Keyed on `.brief-js`, which the script at the end of this file
       sets: with no script there is no clamp and no way to lose text. The hint
       is drawn only on entries the script measured as actually cut. */
    /* The enum line (`.entry-meta`) is short facts, not prose — clamping it
       cut `risk_rule` off the end of a three-enum line. Only prose clamps. */
    .brief-js .brief-entries li > p:not(:first-child):not(:has(> .entry-meta)) {
      display: -webkit-box; -webkit-box-orient: vertical;
      -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden;
    }
    .brief-js .brief-entries li.is-open > p:not(:first-child):not(:has(> .entry-meta)) {
      display: block; -webkit-line-clamp: unset; line-clamp: none; overflow: visible;
    }
    .brief-js .brief-entries li.is-clamped { cursor: pointer; }
    /* A collapsed tile on a phone is the call plus two lines of why. The enum
       line waits for the tap — only on tiles that ARE tappable, so it is never
       more than one action away (a tile with nothing clamped keeps it shown).
       Four calls per screen instead of two. */
    .brief-js .brief-entries li.is-clamped:not(.is-open) > p:has(> .entry-meta) {
      display: none;
    }
    .brief-js .brief-entries li.is-clamped::after {
      content: "展开全文"; display: block; margin-top: 6px;
      font-size: 12px; color: var(--accent);
    }
    .brief-js .brief-entries li.is-clamped.is-open::after { content: "收起"; }
    .brief-js .brief-entries li.is-clamped:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }
  }

  /* Brief-list (for briefs.html index) */
  .brief-list { list-style: none; padding: 0; margin: 8px 0; }
  .brief-list li {
    padding: 10px 14px; background: var(--card-2); border-radius: var(--radius-sm);
    margin: 6px 0; transition: background 0.12s;
  }
  .brief-list li:hover { background: var(--border); }
  .brief-list a {
    color: var(--text); text-decoration: none;
    font-family: var(--mono); font-size: 14px; display: block;
  }
  /* A week whose scheduled review failed. Same row, same rhythm, no link and
     no hover affordance — it has to read as a hole in the series, not as an
     item someone forgot to make clickable. */
  .brief-missing {
    color: var(--text-dim); font-family: var(--mono); font-size: 14px;
    display: block;
  }
  .brief-list li:has(.brief-missing) { background: transparent; border: 1px dashed var(--border); }
  .brief-list li:has(.brief-missing):hover { background: transparent; }

  footer {
    max-width: 1024px; margin: 32px auto 0; padding: 16px;
    color: var(--text-dim); font-size: 12px; text-align: center;
    border-top: 1px solid var(--border);
  }
  footer a { color: var(--text-dim); text-decoration: none; margin: 0 6px; }
  footer a:hover { color: var(--text); }
  footer .disclaimer { margin-top: 8px; font-size: 11px; opacity: 0.7; }
</style>
<!-- Cloudflare Web Analytics — same site token as the dashboard (index.html) so
     Jekyll pages (briefs.html …) are counted too; without this only index.html reports. -->
<script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "704a5341d8c3422a871d6d11d38b25fe"}'></script>
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="brand-mark" src="{{ '/assets/logo-mark.svg' | relative_url }}" alt="" width="24" height="24">
      <h1>clawock</h1>
      <span class="tag">harness · HK + US portfolio</span>
    </a>
    <nav class="topbar-actions">
      <a class="nav-link {% if page.url == '/' or page.url == '/index.html' %}active{% endif %}" href="{{ '/' | relative_url }}">Dashboard</a>
      <a class="nav-link {% if page.url contains 'briefs' %}active{% endif %}" href="{{ '/briefs.html' | relative_url }}">Briefs</a>
      <a class="nav-link" href="https://github.com/KCNyu/clawock" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </div>
</header>

<main>
  <article>
    {{ content }}
  </article>
</main>

<footer>
  <p>
    <a href="https://github.com/KCNyu/clawock">clawock</a> ·
    <a href="{{ '/' | relative_url }}">Dashboard</a> ·
    <a href="{{ '/briefs.html' | relative_url }}">Briefs</a>
  </p>
  <p class="disclaimer">
    Not investment advice. Real positions shown. Point-in-time data. Past performance ≠ future results.
  </p>
</footer>

<script>
  /* Phone-width brief entries: clamp the prose, tap to open (see the
     `.brief-js` rules above). A page with no `.brief-entries` — every page on
     this layout except a brief rendered from 2026-09-11 on — returns at once.
     "Is this entry cut?" is measured (`scrollHeight > clientHeight` on the
     clamped paragraphs), never inferred from its length, so a two-line reason
     does not get a "展开全文" that opens nothing. */
  (function () {
    var items = document.querySelectorAll('article .brief-entries li');
    if (!items.length) return;
    var root = document.documentElement;
    var narrow = window.matchMedia('(max-width: 600px)');
    root.classList.add('brief-js');

    function measure() {
      items.forEach(function (li) {
        if (li.classList.contains('is-open')) return;
        var cut = narrow.matches && Array.prototype.some.call(
          li.querySelectorAll(':scope > p:not(:first-child):not(:has(> .entry-meta))'),
          function (p) { return p.scrollHeight > p.clientHeight + 1; });
        li.classList.toggle('is-clamped', cut);
        if (cut) {
          li.setAttribute('role', 'button');
          li.setAttribute('tabindex', '0');
          li.setAttribute('aria-expanded', 'false');
        } else {
          li.removeAttribute('role');
          li.removeAttribute('tabindex');
          li.removeAttribute('aria-expanded');
        }
      });
    }
    function toggle(li) {
      if (!li.classList.contains('is-clamped')) return;
      var open = li.classList.toggle('is-open');
      li.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    items.forEach(function (li) {
      li.addEventListener('click', function (event) {
        if (event.target.closest('a') || window.getSelection().toString()) return;
        toggle(li);
      });
      li.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          toggle(li);
        }
      });
    });
    measure();
    if (narrow.addEventListener) narrow.addEventListener('change', measure);
    document.querySelectorAll('article details').forEach(function (d) {
      d.addEventListener('toggle', measure);
    });
  })();
</script>

</body>
</html>
