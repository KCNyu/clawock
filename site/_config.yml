title: clawock
description: Agent-native investment decision workflows with deterministic reconciliation and a live HK + US proof
url: https://kcnyu.github.io
baseurl: /clawock
# Site-root relative on purpose: jekyll-seo-tag prepends url+baseurl itself,
# so a baseurl-prefixed value here shipped clawock/clawock/… (404) in every
# rendered page's JSON-LD publisher block (#974).
logo: /assets/logo-mark.svg

# SEO: jekyll-sitemap auto-generates /sitemap.xml on every build (lastmod stays fresh,
# unlike a hand-written static file). GitHub Pages supports this plugin natively.
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag   # per-page <title>/description/canonical/OpenGraph/Twitter/JSON-LD

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'syntax'

# 排除技术文件 / 内部状态
exclude:
  - "*.py"
  - "*.sh"
  - "*.lock"
  - .gitignore
  - .api_keys
  - .cache/
  - data_cache/
  - venv/
  - __pycache__/
  - "*.pyc"
  - scripts/
  - skills/          # SKILL.md 含 {%}/{{}} 字面量给 LLM 用，Jekyll 3.10 没法关 Liquid
  - SESSION_HANDOFF.md
  - DREAMS.md
  - HEARTBEAT.md
  - finance-ai-demo/
  - testgen-go/

# 让 Jekyll 渲染 memory（.md 落盘 / .json plan）+ 静态资源 (dashboard)
include:
  - memory
  - assets

# 关闭 optional_front_matter 插件——避免给 skills/SKILL.md 和 memory/*.md
# 自动加 front matter 后被 Jekyll 当 page 处理触发 Liquid 报错（含 {%} 字面量）
# 它们改走 static files 路线，链接到 GitHub 原始视图
optional_front_matter:
  enabled: false

# 默认 layout（只对真正的 page 生效，static files 不受影响）
defaults:
  - scope:
      path: ""
    values:
      layout: default
      # default OpenGraph/Twitter image for pages that don't set their own (briefs) —
      # jekyll-seo-tag picks this up so every page shares a proper social card
      image: https://kcnyu.github.io/clawock/assets/social-card.png

# Author
author:
  name: kcn
  github: KCNyu
