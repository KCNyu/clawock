[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clawock"
version = "0.1.9"
description = "Agent-native decision-workflow plugin with a verifiable harness"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Shengyu Li" }]
keywords = [
    "agent", "llm", "decision-workflow", "harness", "portfolio", "provenance",
    "reconciliation", "evidence", "audit", "mcp",
]
# Trove classifiers are how PyPI's own search and category filters see this
# package. Without them it is unlisted everywhere a prospective user would
# browse, and nothing local ever shows it: `pip install -e .` never renders a
# project page.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# The one place dependencies are declared. They used to live in nine workflow
# files as drifting `pip install` lines — `requests` in seven, `requests numpy`
# in one, `requests pytest pytest-cov numpy Pillow` in another. The comment
# above that last one already records the cost: a missing numpy once aborted
# pytest collection and silently stopped enforcing the whole suite while the
# run still looked green.
dependencies = [
    # 2.32 is the floor past CVE-2024-35195 (redirect header leak in 2.31.x).
    "requests>=2.32",
    # numpy was in an optional `compute` extra while `portfolio/risk.py` — the
    # module behind the packaged `portfolio-risk` command — imported it at the
    # top level unconditionally. A clean `pip install clawock` therefore shipped
    # a first-class command that raised ImportError on its first line. It is
    # required because it already was; the metadata was the part that was wrong.
    "numpy>=1.26",
    # Required for the same reason, from 2026-08-30: the evaluation and risk
    # lanes (shrinkage estimators, hierarchical clustering, optimisation,
    # distribution tails, eigendecomposition) are not code that should be
    # hand-rolled to keep a wheel small. The alternative on offer was a package
    # where half the analysis commands fail on a clean install, which is worse
    # for "install decision intelligence into any agent" than a bigger download.
    "scipy>=1.11",
]

[project.optional-dependencies]
# `compute = []` lived here from 2026-08-30, when numpy and scipy became
# required and the extra was kept as an alias so its three call sites would not
# break. That trade stopped being cheap once the composite action's own docs
# told users to pass a `compute` selector "when the job needs the heavier
# dependency set" while the heavier set was nothing at all (#1321). The call sites now ask
# for what they actually need, which is the market-data fallback below.
#
# yfinance is the last hop of both quote chains — tier 4 for HK
# (market_data/hk_analysis.py, after Tencent / Eastmoney / stooq) and provider 5
# for US (market_data/us_quotes.py). Both import it lazily inside a try, so a
# missing package does not crash: it silently deletes the bottom of the fallback
# chain, which is exactly the hop that only ever runs when the others are
# already rate-limited (#1325). It is an extra rather than a required
# dependency because that chain has four other hops and yfinance drags pandas
# behind it; it is *declared* because a fallback nobody can install is not one.
market = ["yfinance>=0.2"]
evaluation = ["matplotlib>=3.8"]
# Screenshot and social-card validation.
imaging = ["Pillow>=10"]
# Search Console visibility pull (ops/growth/crawl_visibility.py). Declared here
# for the same reason as everything else in this table: a version pinned in a
# workflow line is a second source of truth that drifts unseen.
seo = ["google-auth>=2.30"]
# Building and checking a distribution. Here rather than in the release workflow
# for the same reason as everything else in this table: a version pinned in a
# workflow line is a second source of truth that drifts unseen.
release = ["build>=1.2", "twine>=5"]
# Everything the test suite needs to *collect*, not just to pass.
# PyYAML is here for the same reason as the rest: the public-entry-point test
# parses .github/ISSUE_TEMPLATE/config.yml as structured data rather than
# substring-matching it, and a test module that cannot import does not fail —
# it stops the whole suite at collection while the run still looks like it ran.
test = ["pytest>=8", "pytest-cov>=5", "Pillow>=10", "PyYAML>=6"]

[project.urls]
Homepage = "https://github.com/KCNyu/clawock"
Documentation = "https://kcnyu.github.io/clawock/"
Source = "https://github.com/KCNyu/clawock"
Issues = "https://github.com/KCNyu/clawock/issues"
# PyPI renders project URLs as the sidebar of the project page, and a
# `Changelog` key is the one downstream tooling looks for by name when it wants
# to show a user what a pending upgrade contains. Without it, "what changed
# between 0.1.0 and 0.1.1" had no answer anywhere a package consumer could see.
Changelog = "https://github.com/KCNyu/clawock/blob/master/CHANGELOG.md"
Evidence = "https://kcnyu.github.io/clawock/evidence.html"

[project.scripts]
clawock = "clawock.cli:main"
clawock-brief-watchdog = "clawock.harness.brief_watchdog:main"
clawock-report-watchdog = "clawock.harness.report_watchdog:main"
clawock-intraday-watchdog = "clawock.harness.intraday_watchdog:main"
clawock-cron-heartbeat = "clawock.automation.cron_heartbeat:main"
clawock-workflow-outcomes = "clawock.automation.workflow_outcomes:main"
clawock-intraday-delta = "clawock.harness.intraday_delta:main"
clawock-gold-fetch = "clawock.market_data.gold.fetch:main"
clawock-gold-update = "clawock.market_data.gold.update:main"
clawock-influencer-scan = "clawock.automation.influencer:main"
clawock-brief-fallback = "clawock.automation.brief_fallback:main"
clawock-news-digest = "clawock.automation.news_digest:main"
clawock-weekly-review = "clawock.automation.weekly_review:main"

[tool.setuptools]
package-dir = {"" = "src"}
# The installable surface is the `clawock` package. It started as a single
# py-module at the repo root, which built a wheel that crashed on import the
# moment it was installed outside the source checkout: the module reached into
# scripts/data/ through a sys.path hack for code the wheel did not contain.
# `pip install -e .` hid that completely, because editable installs leave the
# source tree on sys.path. Anything the CLI imports has to live in here.
#
# scripts/ is still deliberately unpackaged — it is the operator-side
# implementation of this desk, and the coupling there is inside modules rather
# than between them.
#
# Discovered rather than listed. `packages = ["clawock"]` is an *exact* list in
# setuptools, so `clawock.providers` and `clawock.tools` were silently left out of
# the wheel the moment they were added — the rule two paragraphs up, broken by the
# next two PRs that obeyed it in spirit. A pattern brings a new subpackage in by
# construction; a list brings it in only if someone remembers.
[tool.setuptools.packages.find]
where = ["src"]
include = ["clawock*"]

[tool.setuptools.package-data]
clawock = [
    "context/manifest.json",
    "config/*.schema.json",
    "workflows/packs/*/*.json",
    "workflows/packs/*/*.md",
    "workflows/packs/*/references/*.md",
    "workflows/packs/*/references/*.json",
    "workflows/packs/*/assets/*.json",
    "workflows/packs/*/agents/*.yaml",
]
