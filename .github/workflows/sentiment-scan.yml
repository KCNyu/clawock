name: Sentiment Scan

# 21:30 UTC Sun–Thu = 05:30 HKT Mon–Fri, ~2.5h before the 08:00 HKT (00:00 UTC) brief.
# Scheduled this early to absorb GH Actions' typical 1–2h scheduled-cron delay — a job
# nominally 30 min before the brief used to land AFTER the punctual openclaw brief.
# Per-ticker sentiment from FREE public sources:
#   • Reddit JSON   (US: wsb / stocks / investing)
#   • Google News RSS (US: English; HK: 中文 by Chinese name + EN by ticker)
# Writes assets/data/sentiment.json (consumed by agent Mode 5 + dashboard).
on:
  schedule:
    # dow 0-4 not 1-5: 21:30 UTC + 8h wraps to the next HKT day → 1-5 would fire Tue–Sat,
    # missing Monday. Verify with: ./check_crons.sh --timeline
    - cron: '30 21 * * 0-4'
  workflow_dispatch:

# Serialize with other commit-pushing workflows
concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - run: pip install --quiet requests

      - name: Scan sentiment (Reddit + Google News)
        run: python3 scripts/data/fetch_sentiment.py

      - name: Validate sentiment coverage
        run: |
          python3 << 'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          path = Path('assets/data/sentiment.json')
          assert path.is_file(), f'sentiment snapshot missing: {path}'
          data = json.loads(path.read_text(encoding='utf-8'))
          generated_at = data.get('generated_at')
          assert isinstance(generated_at, str), 'sentiment generated_at missing'
          datetime.fromisoformat(generated_at.replace('Z', '+00:00'))
          assert isinstance(data.get('sources'), list) and data['sources'], 'sentiment sources missing'

          tickers = data.get('tickers')
          assert isinstance(tickers, list) and tickers, 'sentiment ticker results missing or empty'
          successful = []
          for row in tickers:
              assert isinstance(row, dict), 'malformed sentiment ticker result'
              ticker = row.get('ticker')
              assert isinstance(ticker, str) and ticker.strip(), 'sentiment ticker missing'
              mentions = row.get('reddit_mentions_7d', 0)
              has_mentions = (isinstance(mentions, (int, float))
                              and not isinstance(mentions, bool) and mentions > 0)
              result_fields = ('reddit_posts', 'google_news_en', 'google_news_zh')
              has_results = any(isinstance(row.get(field), list) and row[field]
                                for field in result_fields)
              if has_mentions or has_results:
                  successful.append(ticker)

          assert successful, 'sentiment snapshot has zero populated source results'
          print(f'sentiment coverage validation OK: {len(successful)} tickers')
          PY

      - name: Commit
        # Shared helper commits only this workflow's sidecar. The frontend fetches
        # it directly; dashboard.json is not rebuilt for it.
        run: |
          bash scripts/data/gha_commit_push.sh "sentiment: daily Reddit + Google News scan $(date -u +%Y-%m-%d)" assets/data/sentiment.json
