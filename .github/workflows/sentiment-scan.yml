name: Sentiment Scan

# 21:30 UTC Sun–Thu = 05:30 HKT Mon–Fri, ~2.5h before the 08:00 HKT (00:00 UTC) brief.
# Scheduled this early to absorb GH Actions' typical 1–2h scheduled-cron delay — a job
# nominally 30 min before the brief used to land AFTER the punctual openclaw brief.
# Per-ticker sentiment from FREE public sources:
#   • Reddit search RSS (one site-wide query for the whole book, matched back
#     to each holding locally — the JSON API answers 403 without OAuth, #1237)
#   • Google News RSS (US: English; HK: 中文 by Chinese name + EN by ticker)
# Writes assets/data/sentiment.json (consumed by agent Mode 5 + dashboard).
on:
  schedule:
    # dow 0-4 not 1-5: 21:30 UTC + 8h wraps to the next HKT day → 1-5 would fire Tue–Sat,
    # missing Monday. Verify with: bash ops/host/check_crons.sh --timeline
    - cron: '30 21 * * 0-4'
    # Second attempt (brief-fallback multi-tier pattern): measured drift
    # (assets/data/schedule-drift.json, n=20) maxes at 213min against this
    # slot's ~150min pre-brief buffer, so ~1 run in 20 landed after the 00:00
    # UTC brief and it read the previous day's sidecar. The scan overwrites
    # idempotently and the commit step no-ops without changes — an already-
    # fresh retry costs nothing.
    - cron: '55 21 * * 0-4'
  workflow_dispatch:

# Serialize with other commit-pushing workflows
concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up clawock (Python)
        uses: ./.github/actions/clawock-python

      - name: Scan sentiment (Reddit + Google News)
        run: clawock sentiment --workspace .

      - name: Validate sentiment coverage
        run: clawock validate-sidecar sentiment

      - name: Snapshot point-in-time copy
        # factor-snapshots/ keeps a verbatim dated copy of every sidecar
        # generation (#936): the live file is overwritten in place, so any
        # later factor research reading it would see today's data, not what
        # the day's decisions actually saw. Research reads the dated row.
        run: python3 ops/ci/snapshot_factor_sidecar.py --source assets/data/sentiment.json

      - name: Commit
        # Shared helper commits only this workflow's sidecar. The frontend fetches
        # it directly; dashboard.json is not rebuilt for it.
        env:
          CLAWOCK_PUBLISH_SSH_KEY: ${{ secrets.CLAWOCK_PUBLISH_SSH_KEY }}
        run: |
          bash ops/publish/gha_commit_push.sh \
            "sentiment: daily Reddit + Google News scan $(date -u +%Y-%m-%d)" \
            assets/data/sentiment.json \
            assets/data/factor-snapshots/sentiment
