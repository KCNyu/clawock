name: Weekly Health Check

# Sundays 23:00 UTC (Monday 07:00 HKT, before the 08:00 brief and HK open).
# Catches drift: scripts that no longer compile, schemas that diverged, missing baselines,
# data sources gone offline. Failures remain visible in Actions and the daily review.
on:
  schedule:
    - cron: '0 23 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  actions: read      # workflow-health rollup reads run history

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - name: Set up clawock (Python)
        uses: ./.github/actions/clawock-python

      - name: Compile all scripts
        run: |
          set -e
          find src ops -type f -name '*.py' -print0 |
          while IFS= read -r -d '' f; do
            python3 -m py_compile "$f"
          done
          echo "OK: all scripts compile"

      - name: Generated cron docs match contract
        run: python3 ops/host/generate_cron_docs.py --check

      - name: argparse contracts unchanged
        # Same probe as ci.yml, from the same registry. Two hand-written lists
        # is how this step spent its life four phases behind (#1317).
        run: python3 ops/ci/argparse_probe.py

      - name: Public data sources reachable
        continue-on-error: true
        run: |
          # FX
          clawock fx --json
          # Sample HK quote (Tencent fallback) — skip if all 3 routes down (network policy)
          python3 -c "
          import sys
          from analyze_hk_stocks import fetch_hk_quotes
          q = fetch_hk_quotes(['00700'])
          print('HK 00700 quote:', q.get('00700', {}).get('price'))
          "

      - name: Scheduled workflow health
        # Report-only rollup. A scheduled workflow fails invisibly — no required
        # check goes red — so news-digest.yml failed three days running in July
        # 2026 with nothing surfacing it. This names failures and, just as
        # important, workflows that quietly stopped firing.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ops/ci/workflow_health.py

      - name: GitHub security features still off
        # #787 closed at a platform boundary, not a to-do: non-provider patterns
        # and validity checks cannot be enabled on a public repository at all.
        # GitHub refuses `advanced_security` with "always available for public
        # repos" while scan-history answers "Advanced Security is disabled on
        # this repository" — both true at once, and the two switches hang off
        # the second one.
        #
        # So this reports the distinction rather than a count: off-and-available
        # is a to-do and warns; off-because-GitHub-does-not-offer-it-here is a
        # fact and stays quiet. A weekly warning nobody can act on is a false
        # alarm with a schedule, and it teaches people to skim the one check
        # that is supposed to be worth reading. If this repo ever goes private
        # with GHAS or moves under an organization, those two start warning
        # again on their own. Report-only either way: nagging about a setting
        # must not be able to red a health run.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ops/ci/security_posture.py --warn

      - name: Peer-map coverage check
        run: |
          python3 << 'PY'
          import json
          pf = json.load(open('portfolio.json'))
          peer_map = json.load(open('memory/peer-map.json')).get('holdings', {})
          missing = []
          for region in ('hk_stocks', 'us_stocks'):
              for h in pf['portfolios'][region]['holdings']:
                  if h.get('shares', 0) > 0 and h['ticker'] not in peer_map:
                      missing.append(f'{h["ticker"]} ({h.get("name","")[:20]})')
          if missing:
              print(f'⚠️ active holdings missing peer-map entry: {missing}')
              print('→ add to memory/peer-map.json so ▎同行扫描 covers them')
          else:
              print(f'✓ all active holdings have peer-map coverage')
          PY

      - name: Plan schema validation
        run: |
          python3 << 'PY'
          import json, glob, sys
          bad = []
          for p in sorted(glob.glob('memory/*-plan.json')):
              try:
                  d = json.loads(open(p).read())
                  assert 'date' in d, f'{p}: missing date'
              except Exception as e:
                  bad.append(f'{p}: {e}')
          if bad:
              print('SCHEMA FAILURES:'); [print(' ', b) for b in bad]
              sys.exit(1)
          print(f'{len(glob.glob("memory/*-plan.json"))} plans OK')
          PY

      - name: Dashboard build idempotency
        run: |
          clawock dashboard-build
          cp assets/data/dashboard.json /tmp/dash1.json
          sleep 1
          clawock dashboard-build
          # Only wall-clock `generated_at` stamps should differ between two runs.
          # These live at the top level AND nested (e.g. build_status.generated_at,
          # added with the health card) — strip every `generated_at` recursively.
          python3 -c "
          import json
          def strip(o):
              if isinstance(o, dict):
                  o.pop('generated_at', None)
                  for v in o.values(): strip(v)
              elif isinstance(o, list):
                  for v in o: strip(v)
              return o
          a = strip(json.load(open('/tmp/dash1.json')))
          b = strip(json.load(open('assets/data/dashboard.json')))
          assert a == b, 'dashboard build is non-deterministic'
          print('dashboard build deterministic ✓')
          "
