name: Dashboard Screenshot Refresh

# Re-screenshot the live dashboard each week so README visuals never drift >7 days.
# Sundays 22:00 UTC (= 06:00 Mon HKT, before Monday's 08:00 brief).
# Scheduled runs refresh the two small PNGs only. The 8MB GIF rebuilds on manual
# dispatch, when the UI it demos has actually changed.
on:
  schedule:
    - cron: '0 22 * * 0'
  workflow_dispatch:

# Serialize with other commit-pushing workflows
concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Playwright + Chromium
        run: |
          npm install --silent playwright@1.60.0
          npx playwright install --with-deps chromium

      - name: Capture win-rate chart + social card
        run: |
          mkdir -p assets
          # Weekly runs skip the expensive uncommitted GIF frames. A manual
          # dispatch captures frames because the next step will assemble them.
          CAPTURE_GIF=${{ github.event_name == 'workflow_dispatch' && '1' || '0' }} \
            NODE_PATH="$GITHUB_WORKSPACE/node_modules" \
            node scripts/data/shoot_dashboard.js

      # The GIF is a product demo of the tab layout, not a price feed — it does not
      # need to track today's quotes. At ~8MB a weekly rebuild had already put 11
      # blobs / ~48MB into a 109MB repo. Rebuild it only when asked (i.e. when the
      # UI actually changed); the two small PNGs still refresh every week.
      - name: Assemble tab-cycle GIF
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 -m pip install --quiet --upgrade Pillow
          python3 scripts/data/assemble_dashboard_gif.py

      - name: Validate tab-cycle GIF
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/data/validate_sidecars.py gif

      - name: Validate screenshots
        run: python3 scripts/data/validate_sidecars.py screenshots

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/shadow-backtest.png assets/social-card.png
          # Only a manual run rebuilds the GIF, so only a manual run may commit it.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git add -- assets/dashboard.gif
          fi
          if git diff --cached --quiet; then
            echo "no visual change"
            exit 0
          fi
          git commit -m "docs: dashboard visual refresh $(date -u +%Y-%m-%d)"
          bash scripts/data/safe_push.sh
