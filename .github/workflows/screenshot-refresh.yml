name: README Refresh (screenshots + metrics)

# One workflow keeps every README current:
#   screenshots — re-shoot the live dashboard so README visuals never drift >7
#                 days (two small PNGs weekly; the 8MB GIF only on manual run)
#   metrics     — recompute the live numbers behind the <!-- CW_M:* -->
#                 placeholders from the ledger + data-plane
# Single commit step, single publish-key binding. Pushes straight to master via
# the publish deploy key (safe_push.sh), which bypasses the PR rule — pure
# refreshes need no review loop.
#
# Sundays 22:00 UTC (= 06:00 Mon HKT, before Monday's 08:00 brief).
on:
  schedule:
    - cron: '0 22 * * 0'
  workflow_dispatch:

# Serialize with other commit-pushing workflows
concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # The published figures (return, shadow portfolio) live on the data-plane
      # branch; the ledger (decisions.jsonl) and the READMEs live on master.
      - uses: actions/checkout@v7
        with:
          ref: data-plane
          path: data-plane

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # `.[imaging]` up front: the GIF steps below are dispatch-only but
      # validate_sidecar screenshots fully decodes the PNGs on every run, so
      # Pillow is needed unconditionally. Installing it once here replaces two
      # separate `pip install` lines that had to stay in sync.
      - name: Set up clawock (Python)
        uses: ./.github/actions/clawock-python
        with:
          install: '.[imaging]'

      - name: Install Playwright + Chromium
        run: |
          npm install --silent playwright@1.60.0
          npx playwright install --with-deps chromium

      - name: Capture win-rate chart + social card
        run: |
          mkdir -p site/assets
          # Weekly runs skip the expensive uncommitted GIF frames. A manual
          # dispatch captures frames because the next step will assemble them.
          CAPTURE_GIF=${{ github.event_name == 'workflow_dispatch' && '1' || '0' }} \
            NODE_PATH="$GITHUB_WORKSPACE/node_modules" \
            node site/tools/shoot_dashboard.js

      # The GIF is a product demo of the tab layout, not a price feed — it does not
      # need to track today's quotes. At ~8MB a weekly rebuild had already put 11
      # blobs / ~48MB into a 109MB repo. Rebuild it only when asked (i.e. when the
      # UI actually changed); the two small PNGs still refresh every week.
      - name: Assemble tab-cycle GIF
        if: github.event_name == 'workflow_dispatch'
        run: python3 site/tools/assemble_dashboard_gif.py

      - name: Validate tab-cycle GIF
        if: github.event_name == 'workflow_dispatch'
        run: clawock validate-sidecar gif

      - name: Validate screenshots
        run: clawock validate-sidecar screenshots

      - name: Recompute README metrics
        # Reuses the packaged ledger directly from src/ — no install needed.
        # Rewrites the <!-- CW_M:* --> placeholders and writes
        # assets/data/readme_metrics.json for audit. Exit contract:
        #   0 = changed, 1 = nothing changed (normal on a quiet week; the
        #   commit step below makes the final call), 2 = real error.
        # Only exit 1 is tolerated — anything else fails the step loudly.
        run: |
          python ops/growth/refresh_readme_metrics.py --data-plane data-plane/assets/data \
            || [ $? -eq 1 ]

      - name: Compose the commit target
        run: |
          # Only a manual run rebuilds the GIF, so only a manual run may commit it.
          paths="site/assets/shadow-backtest.png site/assets/social-card.png"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            paths="$paths site/assets/dashboard.gif"
          fi
          # README metrics placeholders + audit file (refreshed above).
          paths="$paths README.zh.md README.md assets/data/readme_metrics.json"
          echo "COMMIT_PATHS=$paths" >> "$GITHUB_ENV"
          echo "COMMIT_MESSAGE=docs: README refresh (visuals + metrics) $(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Commit if changed
        env:
          CLAWOCK_PUBLISH_SSH_KEY: ${{ secrets.CLAWOCK_PUBLISH_SSH_KEY }}
        uses: ./.github/actions/clawock-commit
        with:
          paths: ${{ env.COMMIT_PATHS }}
          message: ${{ env.COMMIT_MESSAGE }}
