name: Dashboard Artifact Gate

# Every dispatched run used to be titled "data-plane-published" over whatever
# master HEAD was, so successive generations read as the same run repeated in
# the Actions list. The title now carries the generation's data-plane receipt
# behind this workflow's own verb; pages.yml carries the same receipt, which
# pairs the two runs of one generation without making them look like one run
# listed twice. Other events get whitespace, which GitHub replaces with its
# usual title.
run-name: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.reason && format('Validate {0}', github.event.client_payload.reason) || ' ' }}

on:
  # The payload is published to the data branch, not committed to master (#314),
  # so the old `push: paths:` trigger would simply never fire again — no red, no
  # signal, a validation gate switched off by a change somewhere else entirely.
  # This is the same event the publisher raises for the Pages deploy, so the
  # payload is validated on exactly the generations deployed to the site. A
  # generation that moved only automation status raises neither: none of what
  # changed is validated here, and the rest is the generation already checked.
  #
  # #749 asked to fold this into pages.yml so a bad payload could not deploy.
  # Deliberately not done: this gate runs *beside* the deploy, not in front of it,
  # because "a payload failed validation" must not become "the site stops
  # updating" — detect, never silence. A frozen site is the failure mode this desk
  # has actually had (a stale generation with every check green), and it is worse
  # than a visible red DATA badge on a generation the next tick supersedes. The
  # badge in both READMEs is that visibility, and `tests/
  # test_dashboard_artifact_gate_contract.py` holds this workflow's shape.
  repository_dispatch:
    types: [data-plane-published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-dashboard-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the published ledger source_ref may predate this checkout

      # The payload under validation is the published one, so it is fetched
      # rather than read out of the checkout — the checkout no longer carries it,
      # and rebuilding here would validate this runner's output instead of what
      # the site serves.
      - name: Fetch the published generation
        run: python3 ops/pages/fetch_data_plane.py

      - name: Validate published dashboard payload
        run: PYTHONPATH=src python3 -m clawock validate-sidecar dashboard
