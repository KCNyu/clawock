name: readme-metrics

on:
  schedule:
    # Weekly Monday 01:15 UTC — after the weekend closes, before the HK morning brief.
    - cron: "15 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The published figures (return, shadow portfolio) live on the data-plane
      # branch; the ledger (decisions.jsonl) and the READMEs live on master.
      - uses: actions/checkout@v4
        with:
          ref: data-plane
          path: data-plane

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Recompute and refresh README metrics
        # Reuses the packaged ledger directly from src/ — no install needed.
        # Rewrites the <!-- CW_M:* --> placeholders and writes
        # assets/data/readme_metrics.json for audit. Exit 0 = changed.
        run: python ops/growth/refresh_readme_metrics.py --data-plane data-plane/assets/data

      - name: Commit and push if changed
        run: |
          git config user.name "clawock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.zh.md README.md assets/data/readme_metrics.json
          if git diff --cached --quiet; then
            echo "metrics unchanged; nothing to commit"
          else
            git commit -m "docs: refresh README metrics $(date +%F)"
            git push
          fi
