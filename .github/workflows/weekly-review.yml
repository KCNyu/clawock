name: Weekly Portfolio Review (off-host LLM)

# Sunday 22:00 HKT = 14:00 UTC
on:
  schedule:
    - cron: '0 14 * * 0'
  workflow_dispatch:
    inputs:
      as_of:
        description: 'Backfill: review the ISO week ending on this date (YYYY-MM-DD). Empty = this week.'
        required: false
        default: ''

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    # 15, not 12: the chain deadline below is 700s and the contract test wants a
    # minute of slack after it for setup, validation and the commit.
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 100

      - name: Set up clawock (Python)
        uses: ./.github/actions/clawock-python

      # Scheduled runs review the current ISO week. A manual run with as_of backfills
      # the week ending on that date (2026-W37's Sunday run produced nothing and by
      # Monday `date +%V` already named W38). Every later step reads WEEK_ID, so the
      # review, the check and the commit all name the same file.
      - name: Resolve the review week
        env:
          AS_OF_INPUT: ${{ inputs.as_of }}
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import datetime, os
          raw = os.environ.get('AS_OF_INPUT', '').strip()
          today = datetime.datetime.now(datetime.timezone.utc).date()
          day = datetime.date.fromisoformat(raw) if raw else today
          if day > today:
              raise SystemExit(f'as_of {raw} is in the future')
          year, week, _ = day.isocalendar()
          print(f'WEEK_ID={year}-W{week:02d}')
          print(f'AS_OF={raw}')
          PY

      - name: Run weekly review
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          # Chain deadline (brief-fallback 2026-08-17 defect class): without it
          # a hung primary burns timeout x MAX_RETRIES per provider inside the
          # job and the fallback is unreachable.
          #
          # 700, not 600: the primary's share is PRIMARY_BUDGET_SHARE (0.6) of
          # this, and that share has to cover ONE full-length generation --
          # 32000 max_tokens at the slowest throughput measured on the eight
          # scheduled runs 2026-07-12..08-30 (87 tok/s) is 368s. At 600 the
          # share was 360s, i.e. under a run this job is expected to produce.
          # 700 of 900 still leaves the validate + commit steps their share.
          CLAWOCK_LLM_DEADLINE_SECONDS: '700'
        run: clawock-weekly-review ${AS_OF:+--as-of "$AS_OF"}

      - name: Validate generated review
        env:
          WEEKLY_REVIEW_WEEK: ${{ env.WEEK_ID }}
        run: clawock validate-sidecar weekly-review

      - name: Compose the commit target
        run: |
          echo "COMMIT_PATHS=memory/weekly/${WEEK_ID}.md" >> "$GITHUB_ENV"
          echo "COMMIT_MESSAGE=memory: weekly review ${WEEK_ID}" >> "$GITHUB_ENV"

      - name: Commit + push
        env:
          CLAWOCK_PUBLISH_SSH_KEY: ${{ secrets.CLAWOCK_PUBLISH_SSH_KEY }}
        uses: ./.github/actions/clawock-commit
        with:
          paths: ${{ env.COMMIT_PATHS }}
          message: ${{ env.COMMIT_MESSAGE }}
