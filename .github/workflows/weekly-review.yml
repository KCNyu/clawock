name: Weekly Portfolio Review (off-host LLM)

# Sunday 22:00 HKT = 14:00 UTC
on:
  schedule:
    - cron: '0 14 * * 0'
  workflow_dispatch:

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 100

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: pip install --quiet -e .

      - name: Run weekly review
        env:
          XIAOMI_API_KEY: ${{ secrets.XIAOMI_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: python3 scripts/data/gh_action_weekly_review.py

      - name: Validate generated review
        run: clawock validate-sidecar weekly-review

      - name: Commit + push
        env:
          CLAWOCK_PUBLISH_SSH_KEY: ${{ secrets.CLAWOCK_PUBLISH_SSH_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          review_path="memory/weekly/$(date -u +%G-W%V).md"
          git add -- "$review_path"
          if ! git diff --cached --quiet; then
            git commit -m "memory: weekly review $(date -u +%Y-W%V)"
            bash scripts/data/safe_push.sh
          fi
