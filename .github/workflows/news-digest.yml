name: US News Digest (off-host LLM)

# 工作日 21:00 HKT = 13:00 UTC, 美股开盘前 30 分钟
on:
  schedule:
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - run: pip install --quiet requests

      - name: Fetch news + LLM distill
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          XIAOMI_API_KEY: ${{ secrets.XIAOMI_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: python3 scripts/data/gh_action_news_digest.py

      - name: Validate generated digest
        run: |
          python3 << 'PY'
          import json
          from datetime import datetime

          path = 'assets/data/us_news_digest.json'
          with open(path, encoding='utf-8') as f:
              data = json.load(f)

          generated_at = data.get('generated_at')
          assert isinstance(generated_at, str), 'generated_at missing'
          datetime.fromisoformat(generated_at.replace('Z', '+00:00'))

          tickers = data.get('tickers')
          counts = data.get('raw_news_counts')
          digest = data.get('digest_markdown')
          assert isinstance(tickers, list) and tickers, 'tickers missing or empty'
          assert isinstance(counts, dict) and sum(counts.values()) > 0, 'no source news in generated digest'
          assert isinstance(digest, str) and len(digest.strip()) >= 100, 'LLM digest empty or implausibly short'
          assert '### ' in digest, 'LLM digest is not the requested markdown structure'
          print(f'digest validation OK: {len(digest)} chars, {sum(counts.values())} source items')
          PY

      - name: Commit + push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/us_news_digest.json
          if ! git diff --cached --quiet; then
            git commit -m "news: US digest $(TZ=Asia/Hong_Kong date +%Y-%m-%d)"
            bash scripts/data/safe_push.sh
          fi
