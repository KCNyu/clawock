name: US News Digest (off-host LLM)

# Nominally 21:00 HKT (13:00 UTC). Measured drift for this slot is median
# ~75min / max ~157min (assets/data/schedule-drift.json), so the digest
# typically lands ~22:15 HKT and can run past the 21:30 HKT US open — treat it
# as an around-the-open product, not a pre-open one. Re-timing the cron needs
# two weeks of drift data for the new slot first (#780/#781).
on:
  schedule:
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up clawock (Python)
        uses: ./.github/actions/clawock-python

      - name: Fetch news + LLM distill
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          # Same defect brief-fallback fixed on 2026-08-17: without a chain
          # deadline a hung primary burns timeout(180)x3 per provider and the
          # runner kills this 10-minute job before the fallback is ever asked.
          # 360s leaves room for the serial fetch loop (~3.6min worst case)
          # plus validate/commit/push inside the job budget.
          CLAWOCK_LLM_DEADLINE_SECONDS: '360'
        run: clawock-news-digest

      - name: Validate generated digest
        run: clawock validate-sidecar news-digest

      - name: Compose the commit message
        run: |
          echo "COMMIT_MESSAGE=news: US digest $(TZ=Asia/Hong_Kong date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Commit + push
        env:
          CLAWOCK_PUBLISH_SSH_KEY: ${{ secrets.CLAWOCK_PUBLISH_SSH_KEY }}
        uses: ./.github/actions/clawock-commit
        with:
          paths: assets/data/us_news_digest.json
          message: ${{ env.COMMIT_MESSAGE }}
