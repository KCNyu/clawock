name: SEO Visibility

# Weekly Search Console pull, so "are we getting indexed yet" is a number in the
# run log instead of a standing guess.
#
# On GitHub rather than the VPS because that is the standing rule for new
# automation: the box already carries the market schedule, and a check whose
# whole purpose is to survive and observe should not depend on the thing most
# likely to be down. It was briefly a VPS crontab entry, which also managed to
# reproduce both classic cron traps in one line — a bare `python3` that could not
# import the package, and a relative path with no working directory.
#
# Mondays 06:30 UTC. Scheduled runs drift by hours on GitHub; for a weekly
# reading of a number that moves over weeks, that is irrelevant.
on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

# This job commits its reading to `assets/data/crawl_visibility.json`. Before
# that it wrote nothing, and the numbers lived only in the run log — which GitHub
# keeps for 90 days, so the series a trend needs was being deleted a quarter at a
# time. Same writer lane as every other data producer: it commits to master and
# must queue behind them rather than race them.
#
# The file is not published to the pages origin and has no dashboard consumer
# (the Growth tab was removed 2026-09-12: four figures, one reader, and the data
# is not flattering enough to be worth a tab). It is an archive that makes the
# weekly question answerable, and it is read from the checkout.
concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # The extra, not a hand-written package line — dependencies live in
      # pyproject so a version cannot drift between here and there.
      - name: Set up clawock (Python)
        uses: ./.github/actions/clawock-python
        with:
          python-version: '3.12'
          install: '.[seo]'

      - name: Query Search Console
        env:
          # Read-only on one property. Passed as a file path rather than parsed
          # from the environment so the script has one credential interface,
          # whichever host it runs on.
          GSC_CREDENTIALS: ${{ secrets.GSC_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [ -z "${GSC_CREDENTIALS}" ]; then
            echo "::error::GSC_CREDENTIALS is unset — this check cannot see, which is not a pass"
            exit 1
          fi
          printf '%s' "$GSC_CREDENTIALS" > /tmp/gsc.json
          # CLAWOCK_GSC_CREDENTIALS short-circuits the host-path default, so the
          # script never needs the installed package just to find a file.
          #
          # `--snapshot` merges this reading into the committed history and the
          # history table it prints is the reason to keep it: one run log says
          # what today is, five of them side by side say whether anything moved.
          CLAWOCK_GSC_CREDENTIALS=/tmp/gsc.json \
            python3 ops/growth/crawl_visibility.py \
              --snapshot assets/data/crawl_visibility.json | tee /tmp/report.txt
          {
            echo '### Search Console'
            echo '```'
            cat /tmp/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f /tmp/gsc.json

      # The reading is committed even when the run is red for another reason: the
      # snapshot was already merged into the file on disk by the step above, and
      # a week of visibility that ages out of the GSC window behind a failed push
      # is a week nobody can re-measure. When the query itself failed there is
      # nothing staged and the composite exits on its own "nothing to commit".
      - name: Commit the weekly snapshot
        if: always()
        env:
          CLAWOCK_PUBLISH_SSH_KEY: ${{ secrets.CLAWOCK_PUBLISH_SSH_KEY }}
        uses: ./.github/actions/clawock-commit
        with:
          # Both halves of the same reading: the history is the archive, and the
          # summary is what `build_dashboard` embeds into the data-health row.
          # Committed from here rather than derived on the host because they are
          # written by one run from one API response — regenerating either
          # elsewhere is how two numbers for one week start to differ.
          paths: assets/data/crawl_visibility.json assets/data/crawl_visibility_summary.json
          # Quoted: the subject carries its own colon, and unquoted YAML reads the
          # second one as a mapping.
          message: "measurement: search visibility snapshot ${{ github.run_id }}"
