name: Influence Radar (Trump / Musk / Serenity)

# Market-moving statements from high-impact figures (Trump Truth Social原帖 +
# Musk via news proxy), LLM-filtered for relevance + cross-matched to holdings.
# Runs twice on (HKT) weekdays:
#   21:40 UTC Sun–Thu = 05:40 HKT Mon–Fri  → ~2.3h before the 08:00 HKT brief (buffer for
#                                            GH Actions' 1–2h scheduled-cron delay)
#   12:50 UTC Mon–Fri = 20:50 HKT Mon–Fri  → 10 min before US news digest / US open prep
# First cron is dow 0-4 (21:40+8h wraps to next HKT day; 1-5 would miss Monday's brief).
# Second cron does NOT wrap (12:50+8=20:50 same day) so it stays 1-5. ./check_crons.sh --timeline
on:
  schedule:
    - cron: '40 21 * * 0-4'
    - cron: '50 12 * * 1-5'
  workflow_dispatch:

# Serialize with other commit-pushing workflows
concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - run: pip install --quiet requests

      - name: Fetch Trump/Musk + LLM relevance filter
        env:
          XIAOMI_API_KEY: ${{ secrets.XIAOMI_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: python3 scripts/data/fetch_influencer_feed.py

      - name: Validate influencer coverage
        run: |
          python3 << 'PY'
          import json
          import math
          from datetime import datetime
          from pathlib import Path

          path = Path('assets/data/influencer_feed.json')
          assert path.is_file(), f'influencer feed missing: {path}'
          data = json.loads(path.read_text(encoding='utf-8'))

          generated_at = data.get('generated_at')
          assert isinstance(generated_at, str), 'influencer generated_at missing'
          datetime.fromisoformat(generated_at.replace('Z', '+00:00'))

          items = data.get('items')
          assert isinstance(items, list), 'influencer items must be a list'
          assert items, 'influencer feed has zero populated items'
          for index, item in enumerate(items):
              assert isinstance(item, dict), f'influencer item {index} is not an object'
              assert str(item.get('author', '')).strip(), f'influencer item {index} missing author'
              assert str(item.get('text', '')).strip(), f'influencer item {index} missing text'
              relevance = item.get('relevance')
              assert (relevance is None
                      or (isinstance(relevance, (int, float))
                          and not isinstance(relevance, bool)
                          and math.isfinite(relevance))), (
                  f'influencer item {index} has invalid relevance')

          counts = data.get('counts')
          assert isinstance(counts, dict), 'influencer counts missing'
          summary_lists = ('held_hits', 'new_ideas', 'sector_hits')
          for field in summary_lists:
              assert isinstance(data.get(field), list), f'influencer {field} must be a list'
              count = counts.get(field)
              assert isinstance(count, int) and count >= len(data[field]), (
                  f'influencer {field} count/list mismatch')
          total = counts.get('total')
          assert isinstance(total, int) and total >= len(items) > 0, (
              'influencer total count/items mismatch')
          print(f'influencer coverage validation OK: {len(items)} populated items')
          PY

      - name: Commit + push
        # Shared helper commits only this workflow's sidecar. The frontend fetches
        # it directly; dashboard.json is not rebuilt for it.
        run: |
          bash scripts/data/gha_commit_push.sh "influence: Trump/Musk radar $(TZ=Asia/Hong_Kong date +%Y-%m-%d_%H:%M)" assets/data/influencer_feed.json
