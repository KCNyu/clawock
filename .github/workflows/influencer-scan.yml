name: Influence Radar (multi-source)

# Market-moving statements AND actions from high-impact figures, LLM-filtered for
# relevance + cross-matched to holdings. Sources (see clawock/automation/influencer.py):
# Trump 原帖(Truth Social) · Musk 报道(新闻代理) · ARK/Cathie Wood 日度调仓(一手 JSON)
# · Serenity Substack 公开帖 · 段永平/洪灏(zh-HK 港媒) + Burry/Pelosi(en-US) 报道.
# Runs twice on (HKT) weekdays:
#   21:40 UTC Sun–Thu = 05:40 HKT Mon–Fri  → ~2.3h before the 08:00 HKT brief (buffer for
#                                            GH Actions' 1–2h scheduled-cron delay)
#   12:50 UTC Mon–Fri = 20:50 HKT Mon–Fri  → nominally 10 min before the US news
#                                            digest, but this slot's own median drift
#                                            is ~74min (schedule-drift.json), so in
#                                            practice it lands near/after the digest.
#                                            Kept for the twice-daily coverage, not
#                                            the ordering.
# First cron is dow 0-4 (21:40+8h wraps to next HKT day; 1-5 would miss Monday's brief).
# Second cron does NOT wrap (12:50+8=20:50 same day) so it stays 1-5. bash ops/host/check_crons.sh --timeline
on:
  schedule:
    - cron: '40 21 * * 0-4'
    - cron: '50 12 * * 1-5'
  workflow_dispatch:

# Serialize with other commit-pushing workflows
concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # 10, not 8: the LLM ladder may open two chains (2 x 210s = 7min) and the
    # fetch phase is now 13 sequential requests across 8 sources (ARK 6 funds +
    # 5 Google News queries + Trump + Serenity). Pathological worst case is
    # ~130s of timeouts, which did not fit in the 1 minute the 8-minute job left
    # over. tests/test_llm_workflow_deadlines.py still checks 2 chains + 60s.
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up clawock (Python)
        uses: ./.github/actions/clawock-python

      - name: Fetch sources + LLM relevance filter
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          # Chain deadline (brief-fallback 2026-08-17 defect class): a hung
          # primary must not eat the whole job before the fallback answers.
          # This scan retries the whole chain once on failure, so the budget is
          # sized for two chains inside the 8-minute job: 2 x 210s = 7min,
          # leaving setup/validate/commit their share. Relevance-filter outputs
          # are tiny — both legs fit comfortably.
          CLAWOCK_LLM_DEADLINE_SECONDS: '210'
        run: clawock-influencer-scan

      - name: Validate influencer coverage
        run: clawock validate-sidecar influencer

      - name: Commit + push
        # Shared helper commits only this workflow's sidecar. The frontend fetches
        # it directly; dashboard.json is not rebuilt for it.
        env:
          CLAWOCK_PUBLISH_SSH_KEY: ${{ secrets.CLAWOCK_PUBLISH_SSH_KEY }}
        run: |
          bash ops/publish/gha_commit_push.sh "influence: Trump/Musk radar $(TZ=Asia/Hong_Kong date +%Y-%m-%d_%H:%M)" assets/data/influencer_feed.json
