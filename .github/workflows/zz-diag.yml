name: zz-diag (throwaway, never merge)

on:
  pull_request:

permissions:
  contents: read

jobs:
  diag:
    if: github.head_ref == 'claude/ci-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: base-1, cov: '1'}
          - {name: base-2, cov: '1'}
          - {name: base-3, cov: '1'}
          - {name: base-4, cov: '1'}
          - {name: n6-1, cov: '1', workers: '6'}
          - {name: n6-2, cov: '1', workers: '6'}
          - {name: n6-3, cov: '1', workers: '6'}
          - {name: n6-4, cov: '1', workers: '6'}
          - {name: py312-sysmon-1, cov: '1', python: '3.12', core: sysmon}
          - {name: py312-sysmon-2, cov: '1', python: '3.12', core: sysmon}
          - {name: py312-sysmon-3, cov: '1', python: '3.12', core: sysmon}
          - {name: py312-sysmon-4, cov: '1', python: '3.12', core: sysmon}
          - {name: shard0-of-3-r1, cov: '1', shard: '0/3'}
          - {name: shard1-of-3-r1, cov: '1', shard: '1/3'}
          - {name: shard2-of-3-r1, cov: '1', shard: '2/3'}
          - {name: shard0-of-3-r2, cov: '1', shard: '0/3'}
          - {name: shard1-of-3-r2, cov: '1', shard: '1/3'}
          - {name: shard2-of-3-r2, cov: '1', shard: '2/3'}
    name: diag ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/clawock-python
        with:
          install: '.[test]'
          python-version: ${{ matrix.python || '3.11' }}
      - name: Run
        env:
          COV: ${{ matrix.cov }}
          EXTRA: ${{ matrix.extra }}
          DIAG_AT: ${{ matrix.at }}
          DIAG_LATE: ${{ matrix.late }}
          DIAG_OUT: diag-timings.jsonl
          DIAG_SHARD: ${{ matrix.shard }}
          COVERAGE_CORE: ${{ matrix.core }}
          WORKERS: ${{ matrix.workers || 'auto' }}
        run: |
          set -uo pipefail
          nproc; free -m | sed -n 2p
          export PYTHONPATH="$PWD/.diag${PYTHONPATH:+:$PYTHONPATH}"
          args=(tests/ -q -n "$WORKERS" --durations=20 -p diag_plugin)
          if [ -n "$COV" ]; then
            args+=(--cov=clawock --cov=ops --cov-report=json:coverage-report.json)
          fi
          # shellcheck disable=SC2206
          [ -n "$EXTRA" ] && args+=($EXTRA)
          if [ -n "$DIAG_AT" ]; then pip install --quiet time-machine; fi
          start=$(date +%s)
          set +e
          python3 -m pytest "${args[@]}" -rfE > pytest-out.txt 2>&1
          echo "PYTEST_EXIT=$? WALL=$(( $(date +%s) - start ))s"
          grep -E "^(FAILED|ERROR) " pytest-out.txt | cut -c1-330
          tail -1 pytest-out.txt
          python3 .diag/summarize.py diag-timings.jsonl | head -14
          [ -f coverage-report.json ] && python3 -c "import json;t=json.load(open('coverage-report.json'))['totals'];print('COVERAGE',t['num_statements'],t['covered_lines'],t['percent_covered'])"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: timings-${{ matrix.name }}
          path: diag-timings.jsonl
          retention-days: 3
