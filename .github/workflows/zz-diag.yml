name: zz-diag (throwaway, never merge)

on:
  pull_request:

permissions:
  contents: read

jobs:
  diag:
    if: github.head_ref == 'claude/ci-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: load-cov-1, cov: '1'}
          - {name: load-cov-2, cov: '1'}
          - {name: load-cov-3, cov: '1'}
          - {name: load-cov-4, cov: '1'}
          - {name: steal-cov-1, cov: '1', extra: '--dist worksteal'}
          - {name: steal-cov-2, cov: '1', extra: '--dist worksteal'}
          - {name: steal-cov-3, cov: '1', extra: '--dist worksteal'}
          - {name: steal-cov-4, cov: '1', extra: '--dist worksteal'}
          - {name: steal-nocov-1, extra: '--dist worksteal'}
          - {name: steal-nocov-2, extra: '--dist worksteal'}
          - {name: late-400s, late: '400', extra: '--dist worksteal'}
          - {name: sat, at: '2026-10-17 03:00:00'}
          - {name: split-day, at: '2026-10-20 17:00:00'}
          - {name: plus-40d, at: '2026-11-23 03:00:00'}
          - {name: plus-400d, at: '2027-11-18 03:00:00'}
          - {name: new-year, at: '2027-01-01 02:00:00'}
    name: diag ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/clawock-python
        with:
          install: '.[test]'
      - name: Run
        env:
          COV: ${{ matrix.cov }}
          EXTRA: ${{ matrix.extra }}
          DIAG_AT: ${{ matrix.at }}
          DIAG_LATE: ${{ matrix.late }}
          DIAG_OUT: diag-timings.jsonl
        run: |
          set -uo pipefail
          nproc; free -m | sed -n 2p
          export PYTHONPATH="$PWD/.diag${PYTHONPATH:+:$PYTHONPATH}"
          args=(tests/ -q -n auto --durations=20 -p diag_plugin)
          if [ -n "$COV" ]; then
            args+=(--cov=clawock --cov=ops --cov-report=json:coverage-report.json)
          fi
          # shellcheck disable=SC2206
          [ -n "$EXTRA" ] && args+=($EXTRA)
          if [ -n "$DIAG_AT" ]; then pip install --quiet time-machine; fi
          start=$(date +%s)
          set +e
          python3 -m pytest "${args[@]}" -rfE > pytest-out.txt 2>&1
          echo "PYTEST_EXIT=$? WALL=$(( $(date +%s) - start ))s"
          grep -E "^(FAILED|ERROR) " pytest-out.txt | cut -c1-330
          tail -1 pytest-out.txt
          python3 .diag/summarize.py diag-timings.jsonl
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: timings-${{ matrix.name }}
          path: diag-timings.jsonl
          retention-days: 3
