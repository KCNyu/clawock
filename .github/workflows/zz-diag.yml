name: zz-diag (throwaway, never merge)

on:
  pull_request:

permissions:
  contents: read

jobs:
  diag:
    if: github.head_ref == 'claude/ci-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: order-seed-1, extra: '-p random_order --random-order-bucket=global --random-order-seed=1'}
          - {name: order-seed-2, extra: '-p random_order --random-order-bucket=global --random-order-seed=2'}
          - {name: order-seed-3, extra: '-p random_order --random-order-bucket=global --random-order-seed=3'}
          - {name: order-seed-4, extra: '-p random_order --random-order-bucket=global --random-order-seed=4'}
          - {name: order-seed-5, extra: '-p random_order --random-order-bucket=global --random-order-seed=5'}
          - {name: order-seed-6, extra: '-p random_order --random-order-bucket=global --random-order-seed=6'}
          - {name: order-module-seed-1, extra: '-p random_order --random-order-bucket=module --random-order-seed=1'}
          - {name: order-module-seed-2, extra: '-p random_order --random-order-bucket=module --random-order-seed=2'}
    name: diag ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/clawock-python
        with:
          install: '.[test]'
          python-version: ${{ matrix.python || '3.11' }}
      - name: Run
        env:
          COV: ${{ matrix.cov }}
          EXTRA: ${{ matrix.extra }}
          DIAG_AT: ${{ matrix.at }}
          DIAG_LATE: ${{ matrix.late }}
          DIAG_OUT: diag-timings.jsonl
          DIAG_SHARD: ${{ matrix.shard }}
          COVERAGE_CORE: ${{ matrix.core }}
          WORKERS: ${{ matrix.workers || 'auto' }}
        run: |
          set -uo pipefail
          nproc; free -m | sed -n 2p
          export PYTHONPATH="$PWD/.diag${PYTHONPATH:+:$PYTHONPATH}"
          args=(tests/ -q -n "$WORKERS" --durations=20 -p diag_plugin)
          if [ -n "$COV" ]; then
            args+=(--cov=clawock --cov=ops --cov-report=json:coverage-report.json)
          fi
          # shellcheck disable=SC2206
          [ -n "$EXTRA" ] && args+=($EXTRA)
          pip install --quiet pytest-random-order
          start=$(date +%s)
          set +e
          python3 -m pytest "${args[@]}" -rfE > pytest-out.txt 2>&1
          echo "PYTEST_EXIT=$? WALL=$(( $(date +%s) - start ))s"
          grep -E "^(FAILED|ERROR) " pytest-out.txt | cut -c1-260
          tail -1 pytest-out.txt
          python3 .diag/summarize.py diag-timings.jsonl | head -14
          [ -f coverage-report.json ] && python3 -c "import json;t=json.load(open('coverage-report.json'))['totals'];print('COVERAGE',t['num_statements'],t['covered_lines'],t['percent_covered'])"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: timings-${{ matrix.name }}
          path: diag-timings.jsonl
          retention-days: 3
