name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/pages.yml'
      - '_config.yml'
      - '_layouts/**'
      - 'index.html'
      - 'briefs.md'
      - 'README.md'
      - 'README.zh.md'
      - 'robots.txt'
      - 'docs/**'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'assets/data/**'
      - 'assets/*.png'
      - 'assets/*.svg'
      - 'assets/icons/**'
      - 'memory/*-pre-open.md'
      - 'memory/weekly/**'
      - 'config/pages-public.json'
      - 'scripts/build/prepare_pages_artifact.py'
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - '_config.yml'
      - '_layouts/**'
      - 'index.html'
      - 'briefs.md'
      - 'README.md'
      - 'README.zh.md'
      - 'robots.txt'
      - 'docs/**'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'assets/data/**'
      - 'assets/*.png'
      - 'assets/*.svg'
      - 'assets/icons/**'
      - 'memory/*-pre-open.md'
      - 'memory/weekly/**'
      - 'config/pages-public.json'
      - 'scripts/build/prepare_pages_artifact.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Prepare consumer-safe artifact
        run: >-
          python3 scripts/build/prepare_pages_artifact.py
          --site-dir _site
          --output-dir _pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_pages

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
