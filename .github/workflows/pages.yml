name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/pages.yml'
      - 'site/**'
      - 'README.md'
      - 'README.zh.md'
      - 'docs/**'
      - 'assets/data/**'
      - 'memory/*-pre-open.md'
      - 'memory/weekly/**'
      - 'config/pages-public.json'
      - 'ops/pages/**'
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - 'site/**'
      - 'README.md'
      - 'README.zh.md'
      - 'docs/**'
      - 'assets/data/**'
      - 'memory/*-pre-open.md'
      - 'memory/weekly/**'
      - 'config/pages-public.json'
      - 'ops/pages/**'
  # The publisher asks for a deploy once a generation reaches the data branch
  # (#314). A push to that branch cannot do it: `push` runs the workflows on the
  # ref that was pushed, and an orphan data branch carries none. GitHub
  # documents `repository_dispatch` as creating a run even when sent with the
  # automatic GITHUB_TOKEN, so every publisher can ask — the host through its
  # own login, an Actions publisher through the token it already has.
  #
  # #748 asked whether this deploy is needed at all, since the dashboard polls
  # the data branch directly. It is: `site/assets/js/dashboard.ui.js` keeps the
  # **first paint** on this origin on purpose (`overview.json` is the only fetch
  # on the LCP path, and a second origin's handshake there would be paid by every
  # cold visit). Only the polls after that first paint read the branch. Drop this
  # trigger and every cold visitor sees the generation from the last deploy.
  repository_dispatch:
    types: [data-plane-published]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, but never at the cost of losing one. With
# `cancel-in-progress: true` a burst — a merge, an intraday postflight and a
# scheduled tick landing inside a few minutes — becomes a chain where each run
# kills the one before it: on 2026-08-06 four consecutive deploys were cancelled,
# including both that carried a merged fix, and the site sat 48 minutes behind
# with every workflow green. Queuing loses nothing that matters: GitHub keeps the
# run in progress and the latest queued one, and skips only the intermediate
# generations, which the next tick supersedes anyway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The four dashboard outputs are published to an orphan data branch, not
      # to master (#314). The staging step reads them from the checkout, so they
      # have to arrive first. Loud on failure: falling back to whatever the
      # checkout happened to carry is how a site serves a stale generation with
      # every gate still green.
      - name: Fetch the published generation
        run: python3 ops/pages/fetch_data_plane.py

      - name: Stage the owned website source
        run: python3 ops/pages/stage_site.py --output-dir _site-source

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site-source
          destination: ./_site

      - name: Prepare consumer-safe artifact
        run: >-
          python3 ops/pages/prepare_pages_artifact.py
          --site-dir _site
          --output-dir _pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_pages

  deploy:
    # A dispatched run deploys too — that is the entire point of the dispatch.
    # `workflow_dispatch` is included as the manual recourse: once dashboard
    # publishes stop landing on `master`, "push something to force a rebuild"
    # stops being available, and a lost dispatch would otherwise need a dummy
    # commit to recover from. `pull_request` still must not deploy: it is the one
    # event whose build comes from untrusted content.
    if: >-
      github.event_name == 'repository_dispatch'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
