name: Harness Regression

on:
  push:
    branches: [master]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'portfolio.json'
      - 'memory/**-plan.json'
      - 'assets/data/dashboard.json'
      - '.github/workflows/harness-regression.yml'
      - 'config/cron-schedules.json'
      - 'CRON_SCHEDULES.md'
      - '.github/workflows/**'
      - 'skills/tavily-search/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # PR file-policy checks compare the exact base and head commits.
          fetch-depth: 0

      - name: Reject conflict markers
        run: |
          if git grep -nE '^(<<<<<<< |>>>>>>> )' HEAD --; then
            echo "::error::Tracked files contain unresolved git conflict markers"
            exit 1
          fi

      - name: Tavily credit-ledger unit tests
        # Always runs (no path gate) so the hard-budget guardrail's assertions
        # are enforced on every PR and master push — a skills-only change must
        # not skip them. Pure Node, no deps; Node is preinstalled on the runner.
        run: node skills/tavily-search/lib/ledger.test.mjs

      - name: PR file safety policy
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA")
          bad=()
          for f in "${files[@]}"; do
            case "$f" in
              .api_keys|*/.api_keys|.openclaw/*|*/.openclaw/*|.clawhub/*|*/.clawhub/*|memory/.dreams/*|memory/.tmp/*)
                bad+=("$f")
                ;;
              *.png|*.jpg|*.jpeg)
                [[ "$f" == assets/* ]] || bad+=("$f")
                ;;
            esac
          done
          if ((${#bad[@]})); then
            printf '::error::Forbidden PR path: %s\n' "${bad[@]}"
            exit 1
          fi
          echo "PR file policy OK: ${#files[@]} changed paths"

      - name: Detect code changes
        # Scope the heavy Python steps to what a PR actually touches. This job
        # (and the required `validate` context) always runs; a docs/markdown-only
        # PR just skips the expensive steps and still reports green in seconds.
        # We must NOT path-filter the pull_request trigger itself: a required
        # check that is filtered out never reports and blocks the PR forever
        # (see actionlint.yml). Skipped *steps* count as success, so we gate here.
        # Only runs on PRs; non-PR events force the steps on via the `if:` below.
        #
        # Keep this path set in sync with the `push:` trigger `paths:` at the top
        # of this file — both answer "does this change affect validate?".
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # --no-renames: a rename OUT of a watched dir (e.g. scripts/x.py ->
          # docs/x.py) must still surface the old path and run the suite, since it
          # can break imports. No --diff-filter, so deletions count too, matching
          # the push trigger's paths. Capture separately (not via process
          # substitution) so a git failure fails this step — fail-closed, validate
          # goes red — instead of being read as an empty, docs-only diff and
          # silently skipping the suite.
          changed="$(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA")"
          # memory/decisions.jsonl is intentionally absent: like the push trigger,
          # the ledger is automation-committed runtime data, not edited via
          # interactive PRs.
          code=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              scripts/*|tests/*|portfolio.json|memory/*-plan.json|assets/data/dashboard.json|config/cron-schedules.json|CRON_SCHEDULES.md|.github/workflows/*)
                code=true
                break
                ;;
            esac
          done <<< "$changed"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code"

      - name: Set up Python
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install minimal deps
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        # numpy is required to *collect* tests/, not just to run one of them:
        # portfolio_risk_metrics imports it at module level, so without it pytest
        # aborts the whole run with a collection error and all 78 tests silently
        # stop being enforced — a green-looking local run hides this completely.
        # Pillow: validate_sidecars now fully-decodes screenshots/GIF (finding #12);
        # the real asset checks run in screenshot-refresh.yml (which has Pillow) but
        # the unit tests here exercise the same validators, so pytest needs it too.
        run: pip install --quiet requests pytest numpy Pillow

      - name: Unit tests — money-integrity derivations
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        run: python3 -m pytest tests/ -q

      - name: Generated cron docs match contract
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        run: python3 scripts/data/generate_cron_docs.py --check

      - name: Import-check all scripts
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        run: |
          set -e
          for f in scripts/data/*.py scripts/harness/*.py; do
            echo "syntax check: $f"
            python3 -m py_compile "$f"
          done

      - name: argparse-check harness CLIs
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        run: |
          set -e
          python3 scripts/harness/report_preflight.py --help > /dev/null
          python3 scripts/harness/report_postflight.py --help > /dev/null
          python3 scripts/harness/intraday_preflight.py --help > /dev/null
          python3 scripts/harness/intraday_postflight.py --help > /dev/null
          python3 scripts/harness/brief_preflight.py --help > /dev/null 2>&1 || true
          python3 scripts/harness/brief_postflight.py --help > /dev/null 2>&1 || true
          echo "OK: all argparse parsers loadable"

      - name: Schema-validate portfolio.json
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        run: |
          python3 << 'PY'
          import json, sys
          with open('portfolio.json') as f: p = json.load(f)
          assert 'portfolios' in p, 'missing top-level portfolios'
          for region in ('us_stocks', 'hk_stocks'):
              assert region in p['portfolios'], f'missing {region}'
              leg = p['portfolios'][region]
              assert isinstance(leg.get('holdings', []), list), f'{region}.holdings not list'
              for h in leg['holdings']:
                  for k in ('ticker', 'shares', 'cost_basis'):
                      assert k in h, f'{region} holding missing {k}: {h.get("ticker")}'
          print('portfolio.json: schema OK')
          PY

      - name: Schema-validate memory/*-plan.json
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        run: |
          python3 << 'PY'
          import json, glob, sys
          sys.path.insert(0, 'scripts/data')
          import decision_v2
          for p in sorted(glob.glob('memory/*-plan.json')):
              with open(p) as f: d = json.load(f)
              errors = decision_v2.validate_plan(d, p)
              assert not errors, f'{p}: {errors}'
              print(f'{p}: OK')
          PY

      - name: Decision v2 unit tests and ledger audit
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        run: |
          python3 -m unittest discover -s tests -p 'test_decision_v2.py' -v
          python3 << 'PY'
          import json, glob, sys
          sys.path.insert(0, 'scripts/data')
          import decision_v2
          led = decision_v2.load_decisions()
          ids = [d['decision_id'] for d in led]
          dupes = len(ids) - len(set(ids))
          assert not dupes, f'{dupes} duplicate decision_id in ledger'
          errors = [f"{d['decision_id']}: {e}" for d in led for e in decision_v2.validate_decision(d)]
          assert not errors, errors[:10]
          # Every scored decision must trace back to a plan somebody authored. The
          # v1 migration fabricated 25 that did not, inflating the episode count
          # and the published curve for six weeks; each was individually valid, so
          # only this cross-check catches the class.
          authored = set()
          for p in glob.glob('memory/*-plan.json'):
              with open(p) as f:
                  authored |= {x['decision_id'] for x in (json.load(f).get('decisions') or [])}
          orphans = sorted(set(ids) - authored)
          assert not orphans, f'{len(orphans)} ledger decisions authored by no plan: {orphans[:5]}'
          # settle must be a pure recompute from canonical bars, not a ratchet. Compare
          # settle-twice, never against the stored ledger: build_dashboard settles
          # in memory without writing back, so on disk it legitimately trails the
          # intraday snapshot and a freshness check here would just flake.
          decision_v2.settle_decisions(led)
          once = json.dumps(led, sort_keys=True)
          decision_v2.settle_decisions(led)
          assert json.dumps(led, sort_keys=True) == once, 'settle_decisions is not idempotent'
          print(f'ledger OK: {len(led)} decisions · {len({d["episode_id"] for d in led})} episodes · 0 orphans')
          PY

      - name: Rebuild dashboard.json and validate
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        run: |
          python3 scripts/data/build_dashboard.py
          python3 << 'PY'
          import json
          with open('assets/data/dashboard.json') as f: d = json.load(f)
          needed = ['generated_at','fx','totals','concentration','holdings','snapshots','decision_metrics','episode_backtest','decision_delta']
          missing = [k for k in needed if k not in d]
          assert not missing, f'missing keys: {missing}'
          for leg in ('us', 'hk'):
              assert leg in d['holdings'], f'holdings.{leg} missing'
              assert leg in d['concentration'], f'concentration.{leg} missing'
              c = d['concentration'][leg]
              assert 'hhi' in c and 'top2' in c and 'verdict' in c, f'{leg} concentration incomplete'
              assert c['verdict']['level'] in ('healthy','moderate','concentrated','danger'), f'bad verdict level'
          print('dashboard.json: schema OK')
          PY

      - name: Run build_dashboard sanity
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        run: |
          # confirm it runs idempotently
          python3 scripts/data/build_dashboard.py
          python3 scripts/data/build_dashboard.py
          echo "OK: build_dashboard idempotent"

  smoke-data-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: validate
    continue-on-error: true  # data sources can be flaky; don't fail the pipeline
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - run: pip install --quiet requests

      - name: FX fallback chain
        run: |
          out=$(python3 scripts/data/fetch_fx.py --json) || exit 1
          echo "$out"
          python3 -c "import json,sys; d=json.load(open('-')) if False else json.loads('''$out'''); assert 7 < d['rate'] < 9, f'FX rate out of range: {d[\"rate\"]}'; print('FX OK:', d['source'])"
