name: Release

# Tag-triggered, never automatic on merge: publishing a version to PyPI cannot be
# undone — the version number is burned even if the release is yanked. The tag is
# the human decision, and the `pypi` environment lets that decision carry a
# required reviewer as well.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      repository:
        description: 'index to publish to'
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]
      npm_only:
        description: >-
          publish only clawock-dsh to npm. Skips the PyPI publish job and never
          creates a GitHub Release. Use it to repair the npm side of a version
          whose PyPI upload already succeeded (a half-published release), or to
          rehearse the npm job from end to end.
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up clawock (Python)
        uses: ./.github/actions/clawock-python
        with:
          install: '.[release]'

      - name: Build sdist and wheel
        run: |
          python -m build
          python -m twine check dist/*

      - name: Tag matches the packaged version
        # A tag that disagrees with pyproject publishes a version nobody asked
        # for, under a name that already means something else in the changelog.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          packaged=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tagged=${GITHUB_REF_NAME#v}
          [ "$packaged" = "$tagged" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match version $packaged"
            exit 1
          }

      - uses: ./.github/actions/clawock-node
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Refuse what github-release would refuse, before anything is published
        # github-release re-checks both of these, but it runs after PyPI and npm
        # have accepted the version: a stale lib/ or a missing CHANGELOG section
        # found there leaves a burned, half-released version (#1881). Same bump,
        # same build, same diff and the same renderer as that job, so a tag that
        # passes here cannot fail there for these reasons.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
          NO_UPDATE_NOTIFIER: '1'
          npm_config_replace_registry_host: 'always'
        run: |
          set -euo pipefail
          target="${GITHUB_REF_NAME#v}"
          python3 ops/publish/release_notes.py "$target" --output "$RUNNER_TEMP/release-notes.md"
          cd examples/dsh/packages/clawock-dsh
          current="$(node -p "require('./package.json').version")"
          if [ "$current" != "$target" ]; then
            npm version "$target" --no-git-tag-version
          fi
          npm install --include=dev --no-audit --no-fund
          npm run build
          git diff --exit-code -- lib || {
            echo "::error::committed lib/ differs from a fresh build at this tag — nothing was published; fix lib on master and cut a new tag"
            exit 1
          }

      - name: Isolated install completes one real run
        # The acceptance for #379, executed against the artifact about to ship
        # rather than the source tree: a clean environment, no checkout, no
        # OpenClaw, no KCNyu workspace.
        #
        # The steps live in examples/cli/minimal-run/run.sh rather than here so that
        # what CI proves and what a reader can run are one file. Inline, this was
        # a proof only GitHub could execute.
        run: examples/cli/minimal-run/run.sh dist/*.whl

      - name: Harness-free run (harness-agnostic contract)
        # Same discipline as minimal-run, through the harness-agnostic example:
        # the contract is files + CLI, so a run with no harness at all must
        # publish identically to one driven by an OpenClaw skill, a Claude Code
        # instruction or a DeepSeek Harness agent (examples/).
        run: examples/cli/run.sh dist/*.whl

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    # npm_only dispatches must never touch PyPI: the index already holds that
    # version (exactly the half-published state this mode exists to repair), and
    # re-uploading the same version is a hard failure.
    #
    # The input is matched in both representations GitHub has been observed to
    # deliver (string 'true' via `-f`/UI checkbox, boolean true after schema
    # normalization): the predicate must hold for both or a dispatch silently
    # reverts to the default.
    if: inputs.npm_only != 'true' && inputs.npm_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted publishing: PyPI verifies this workflow's OIDC identity, so there is
    # no long-lived API token in repository secrets to leak or rotate. One-time
    # setup on the PyPI side is documented in docs/operations/release.md.
    #
    # The environment is also the gate on WHERE a publish may come from. It used
    # to be neither: #810 found `protection_rules: []` and
    # `deployment_branch_policy: null`, while this comment asserted the
    # environment also carried a reviewer requirement — describing a control
    # nobody had configured, which is worse than saying nothing, because the
    # next reader assumes someone is watching that door.
    #
    # It now carries a deployment branch policy of exactly one entry, tag `v*`.
    # Measured both directions before trusting it: dispatching this workflow
    # from a branch with `repository: pypi` fails with the publish job running
    # ZERO steps (run 32551418697), while the same dispatch from a tag runs the
    # job for real (run 32551500712, which then stopped at PyPI's own "File
    # already exists" because the version was unchanged). No required reviewer:
    # that is friction on every release and is a preference, not a defect —
    # unlike the branch hole, which was reachable.
    environment: ${{ inputs.repository || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      - name: Publish
        # Pinned to a commit, not to the moving `release/v1` (#808). This
        # repository has already paid for letting something outside it decide
        # which version of a publishing tool runs: v0.1.6 half-published because
        # the runner image's bundled npm crashed, and the fix was pinning npm.
        # The PyPI half was still on a mutable ref.
        #
        # NOT the SHA that `refs/tags/v1.14.2` points at — that is an annotated
        # tag object (a892a5a6…). The commit is one dereference further in.
        #
        # `attestations` is deliberately not set: the action defaults it to
        # 'true' and PEP 740 attestations are already being issued. Verified on
        # the published artifact rather than assumed:
        #   GET https://pypi.org/integrity/clawock/0.1.8/<file>/provenance
        #   -> publisher {kind: GitHub, repository: KCNyu/clawock,
        #                 workflow: release.yml, environment: pypi}
        # (The /pypi/{pkg}/json view reports `provenance: null` for every
        # package including sigstore and uv, so it cannot be used to check this.
        # #808 was originally filed off that mistake.)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/legacy/' || '' }}

  npm:
    # The DSH skill package rides the same version train as the Python package:
    # a v* tag publishes clawock to PyPI and clawock-dsh to npm together, and an
    # explicit npm_only dispatch runs the npm side alone from any ref — never
    # PyPI and never a GitHub Release.
    needs: build
    # TestPyPI tag rehearsals must not publish to npm. The npm_only repair path
    # is independent of the PyPI repository selector (whose default is testpypi).
    if: (startsWith(github.ref, 'refs/tags/v') && inputs.repository != 'testpypi') || inputs.npm_only == 'true' || inputs.npm_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The OIDC token npm exchanges for a provenance attestation. Without it
      # `npm publish --provenance` cannot run, and the publish script degrades
      # to an unsigned publish rather than failing — so this line is the whole
      # difference between a signed and an unsigned release.
      id-token: write
    env:
      # 2026-08-17: the 0.1.6 npm job died because its package-lock.json had
      # been regenerated on the desk under a mirror registry — every `resolved`
      # URL pointed at mirrors.tencentyun.com, which the GitHub runner cannot
      # reach. Each tarball fetch stalled through npm's whole retry ladder
      # (~71s) and npm exited with `Exit handler never called!`. The lockfile
      # now carries registry.npmjs.org URLs again, and replace-registry-host
      # rehosts any lockfile URL to the configured registry, so a future
      # mirror-generated lockfile cannot silently break the runner again.
      # (IPv4-first DNS and the suppressed update ping are rust-proofing
      # against runner-side fetch stalls, not the 2026-08-17 root cause.)
      NODE_OPTIONS: --dns-result-order=ipv4first
      NO_UPDATE_NOTIFIER: '1'
      npm_config_replace_registry_host: 'always'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/clawock-node

      - name: Publish clawock-dsh to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # The version lives in pyproject.toml; on a v* tag the build job has
          # already refused a tag that disagrees with it. Deriving it here
          # instead of from the ref name lets this same job run from a branch
          # dispatch (npm_only) without inventing a version out of a branch.
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "publishing clawock-dsh@${version}"
          # The readback is npm-readback's job, not this one's: see there.
          ops/publish/publish_dsh_plugin.sh --no-verify "$version"

  npm-readback:
    # Downloads what the registry serves for this version and compares it to a
    # fresh build of the same commit (#712/#732). Red on a real mismatch or on a
    # version the registry still does not serve after the script's wait budget.
    #
    # Its own job, and deliberately not in github-release's `needs`. Until 0.3.0
    # it was the tail of the npm job: on 2026-09-29 the registry took ~2.5 min
    # to serve an accepted publish, the readback gave up after 41s, the npm job
    # went red and github-release was skipped — for a version npm, PyPI and the
    # pushed tag all already carried, so the Release had to be made by hand.
    # Whether the registry copy matches is a fact about a publish that has
    # already happened and cannot be undone; withholding the Release does not
    # repair it, it only leaves the tag without one.
    needs: npm
    runs-on: ubuntu-latest
    # The script waits up to DSH_READBACK_TIMEOUT_S (900s) for the registry;
    # the job needs room for that plus install and build.
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      NO_UPDATE_NOTIFIER: '1'
      npm_config_replace_registry_host: 'always'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/clawock-node

      - name: Compare the registry copy with this build
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          ops/publish/publish_dsh_plugin.sh --verify-only "$version"

  github-release:
    # A GitHub Release is a public claim that the version exists. Create it only
    # for a real version tag, and only after PyPI accepted that exact artifact
    # and npm accepted the skill package. TestPyPI workflow_dispatch runs have
    # a branch ref and deliberately skip it. The registry readback runs beside
    # it (npm-readback), not in front of it.
    needs: [publish, npm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      # Opening the Announcements thread that carries the release notes (#786).
      discussions: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      - uses: ./.github/actions/clawock-node

      - name: Pack the DSH skill package for the release
        # Idempotent bump: `npm version <same>` exits non-zero (#617). When the
        # tag version already equals package.json, just pack what is there.
        env:
          # Same runner hardening as the npm publish job: a lockfile generated
          # behind a mirror registry stalls every fetch here too (see that
          # job's 2026-08-17 note).
          NODE_OPTIONS: --dns-result-order=ipv4first
          NO_UPDATE_NOTIFIER: '1'
          npm_config_replace_registry_host: 'always'
        run: |
          set -euo pipefail
          cd examples/dsh/packages/clawock-dsh
          target="${GITHUB_REF_NAME#v}"
          current="$(node -p "require('./package.json').version")"
          if [ "$current" != "$target" ]; then
            npm version "$target" --no-git-tag-version
          else
            echo "dsh-plugin already at $target — skipping bump"
          fi
          # Rebuild lib from src exactly like the npm job does before it
          # publishes, then refuse to ship a stale tree. The release tgz and
          # the npm tarball carry the same version number, so they must be the
          # same build — #712 was that failure mode with two producers. A tag
          # can point at a commit no CI run ever gated (validate's
          # rebuild-is-no-op check is lane-gated), so this cannot be inherited.
          npm install --include=dev --no-audit --no-fund
          npm run build
          git diff --exit-code -- lib || {
            echo "::error::committed lib/ differs from a fresh build at this tag — the release tgz would diverge from the published npm tarball; fix lib on master and cut a new tag"
            exit 1
          }
          npm pack

      - name: Render the public-package changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 ops/publish/release_notes.py "$version" --output /tmp/release-notes.md
          printf '\n### npm\n\nclawock-dsh@%s published to [npm](https://www.npmjs.com/package/clawock-dsh).\n' "$version" >> /tmp/release-notes.md

      - name: Publish GitHub Release with the verified distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* examples/dsh/packages/clawock-dsh/*.tgz \
            --verify-tag \
            --title "clawock $GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md

      - name: Announce the release in Discussions
        # A release becomes something a reader can reply to, and a page search
        # engines index, instead of a one-way artifact drop (#786).
        #
        # A separate best-effort step on purpose. Passing --discussion-category
        # to `gh release create` would put the announcement on the critical path
        # of publishing: a failure there leaves a tagged version whose GitHub
        # Release was never created, and the retry then collides with the
        # release that partially exists. The release is the deliverable; the
        # thread is not.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --discussion-category Announcements \
            || echo "::warning::no Announcements thread for $GITHUB_REF_NAME — the release itself is unaffected"
