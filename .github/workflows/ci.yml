name: CI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  skipped_scope:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.lane.outputs.code }}
    steps:
      - id: lane
        run: echo 'code=true' >> "$GITHUB_OUTPUT"
  skipped_optional:
    needs: skipped_scope
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo optional lane
  skipped_validate:
    needs: [skipped_scope, skipped_optional]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      code: ${{ needs.skipped_scope.outputs.code }}
    steps:
      - run: exit 0
  skipped_original:
    needs: skipped_validate
    if: ${{ needs.skipped_validate.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo original predicate executed
  skipped_fixed:
    needs: skipped_validate
    if: ${{ !cancelled() && needs.skipped_validate.result == 'success' && needs.skipped_validate.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo fixed predicate executed
  all_success_scope:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.lane.outputs.code }}
    steps:
      - id: lane
        run: echo 'code=true' >> "$GITHUB_OUTPUT"
  all_success_optional:
    needs: all_success_scope
    if: ${{ true }}
    runs-on: ubuntu-latest
    steps:
      - run: echo optional lane
  all_success_validate:
    needs: [all_success_scope, all_success_optional]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      code: ${{ needs.all_success_scope.outputs.code }}
    steps:
      - run: exit 0
  all_success_original:
    needs: all_success_validate
    if: ${{ needs.all_success_validate.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo original predicate executed
  all_success_fixed:
    needs: all_success_validate
    if: ${{ !cancelled() && needs.all_success_validate.result == 'success' && needs.all_success_validate.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo fixed predicate executed
  book_scope:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.lane.outputs.code }}
    steps:
      - id: lane
        run: echo 'code=false' >> "$GITHUB_OUTPUT"
  book_optional:
    needs: book_scope
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo optional lane
  book_validate:
    needs: [book_scope, book_optional]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      code: ${{ needs.book_scope.outputs.code }}
    steps:
      - run: exit 0
  book_original:
    needs: book_validate
    if: ${{ needs.book_validate.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo original predicate executed
  book_fixed:
    needs: book_validate
    if: ${{ !cancelled() && needs.book_validate.result == 'success' && needs.book_validate.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo fixed predicate executed
  failed_scope:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.lane.outputs.code }}
    steps:
      - id: lane
        run: echo 'code=true' >> "$GITHUB_OUTPUT"
  failed_optional:
    needs: failed_scope
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo optional lane
  failed_validate:
    needs: [failed_scope, failed_optional]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      code: ${{ needs.failed_scope.outputs.code }}
    steps:
      - run: exit 1
  failed_original:
    needs: failed_validate
    if: ${{ needs.failed_validate.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo original predicate executed
  failed_fixed:
    needs: failed_validate
    if: ${{ !cancelled() && needs.failed_validate.result == 'success' && needs.failed_validate.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo fixed predicate executed
  evidence:
    needs: [skipped_validate, skipped_original, skipped_fixed, all_success_validate, all_success_original, all_success_fixed, book_validate, book_original, book_fixed, failed_validate, failed_original, failed_fixed]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYPROBE'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          print(json.dumps(results, indent=2))
          for case, expected in [('skipped', ('success', 'skipped', 'success')), ('all_success', ('success', 'success', 'success')), ('book', ('success', 'skipped', 'skipped')), ('failed', ('failure', 'skipped', 'skipped'))]:
              actual = tuple(results[f'{case}_{job}']['result'] for job in ['validate', 'original', 'fixed'])
              assert actual == expected, (case, actual, expected)
          assert results['skipped_validate']['outputs']['code'] == 'true'
          print('All four scheduler cases confirmed')
          PYPROBE
