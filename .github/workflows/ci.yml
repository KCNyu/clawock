name: CI

# One workflow for the whole code-quality gate (#884). It consolidates three
# files that fired together on every PR and master push but carried three
# different push-path policies and three copies of the same trigger reasoning:
#
#   harness-regression.yml -> `validate` (+ publish-coverage, smoke-data-fetch)
#   actionlint.yml         -> `lint`
#   codeql.yml             -> `Analyze (...)` x3 + the aggregate `CodeQL` check
#
# The required check contexts are byte-identical to what the branch ruleset
# pins — a context comes from the job name, not from the file — so no ruleset
# change ships with this. What changed is that there is exactly ONE push-path
# list, ONE concurrency policy and ONE place where "which push runs what" is
# decided, instead of a positive list next to an ignore-list next to another
# positive list.
#
# The push trigger below stays a positive list on purpose: pure-data commits
# (~85% of master pushes) must not start CI at all, so the Actions tab keeps
# showing results instead of skipped runs (#782). The weekly Saturday backstop
# runs the full matrix whatever the push lane missed.
on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'ops/**'
      - 'pyproject.toml'
      # pytest.ini carries test options; a change there can change what the
      # suite enforces just like pyproject.toml can.
      - 'pytest.ini'
      - 'tests/**'
      # The dashboard moved under site/ in #399; these globs kept the
      # pre-move paths and stopped matching anything.
      - 'site/assets/css/**'
      - 'site/assets/js/**'
      - 'site/index.html'
      # The screenshot/GIF tooling. Until #754 it was in no trigger, in no
      # detector lane and in no syntax check: the only thing that ever ran it
      # was the weekly screenshot-refresh cron, which commits its output.
      - 'site/tools/**'
      # The Decision Studio plugin sources were watched by the detector but
      # missing here, so a plugin-only master push started nothing on master;
      # the contracts only ever ran on PRs. Closing that hole (#884).
      - 'examples/dsh/**'
      - 'portfolio.json'
      - 'memory/**-plan.json'
      # Research artifacts are validated by the suite below, so a
      # bad thesis/earnings/gate artifact must be able to red it.
      - 'memory/theses/**'
      - 'memory/earnings/**'
      - 'memory/entry-gates/**'
      # Composite actions are code the jobs execute; a broken edit deserves a
      # red run on master too, not only on the PR that introduced it.
      - '.github/actions/**'
      # Whole directory on purpose: every file here (cron contract, instrument
      # registry, thesis/earnings schemas, news-evidence policy, peer rules) is
      # read by the suite, and naming them one by one already left new schemas
      # ungated — a config-only PR then skipped the tests that guard them.
      - 'config/**'
      - 'docs/operations/cron-schedules.md'
      - '.github/workflows/**'
      - 'skills/tavily-search/**'
  pull_request:
  # Weekly full-matrix backstop (inherited from codeql.yml's schedule): a
  # scheduled event has no diffable range, so the detector answers "everything
  # changed" and lint + validate + smoke + all three Analyze jobs run in full.
  # Saturday 03:41 UTC — an uncontended slot, because measured schedule drift
  # in this repository runs 10-160 minutes and is driven by how busy the UTC
  # hour is (#781).
  schedule:
    - cron: '41 3 * * 6'
  workflow_dispatch:

permissions:
  contents: read

# A superseded PR run is worth nothing: the only result anybody reads is the one
# for the tip of the branch. On master the opposite holds — every green there is
# part of the ledger, so those runs are never cancelled. Deliberately NOT the
# `cancel-in-progress: false` that pages.yml uses; that one exists so a burst of
# deploys cannot lose a generation, which is the opposite requirement.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    # Was actionlint.yml: a 12-second lint should not pay for its own workflow
    # file, its own trigger block and its own runner on every event. The job
    # name keeps the required `lint` context byte-identical.
    #
    # It is also this workflow's scope job, and deliberately not a *new* job:
    # it already runs on every event and already pays a checkout to classify
    # the push, so `analyze` can read the answer from here instead of starting
    # three runners to compute it again (#910). Adding a separate `scope` job
    # would have cost every run an extra runner to save three on 22% of pushes.
    outputs:
      analysable: ${{ steps.scope.outputs.analysable }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      # On PRs, schedule and dispatch: always lint — `lint` is a required check
      # and must report on every PR even when no workflow file changed
      # (a path-filtered required check waits forever). On master pushes the
      # workflow fires for any code path below, so gate on an actual diff under
      # .github/workflows/ instead; undiffable ranges lint anyway (fail toward
      # running a 12s check rather than skipping it). Classification lives in
      # ops/ci/push_scope.py — the same classifier the other two gates read.
      #
      # The whole classification is published (not just `workflows=`): the
      # `analysable` lane is what gates CodeQL below. Non-push events answer
      # "everything" for both lanes — a PR is always linted and always
      # analysed, which is what the required contexts need.
      - name: Classify this event
        id: scope
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then
            printf 'workflows=true\nanalysable=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${BASE_SHA:-}" ] && [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ] \
             && git fetch --quiet --depth=1 origin "${BASE_SHA}"; then
            python3 ops/ci/push_scope.py --base "${BASE_SHA}" --head HEAD \
              | tee -a "$GITHUB_OUTPUT"
          else
            echo "no diffable base (${BASE_SHA:-}) — linting and analysing"
            printf 'workflows=true\nanalysable=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned actionlint
        if: steps.scope.outputs.workflows == 'true'
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "/tmp/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  /tmp/${archive}" | sha256sum --check --strict
          tar -xzf "/tmp/${archive}" -C /tmp actionlint
          /tmp/actionlint -version

      - name: Lint GitHub Actions
        if: steps.scope.outputs.workflows == 'true'
        run: /tmp/actionlint -color

  validate:
    outputs:
      # Job-level mirror of the detector, so sibling jobs can gate without a
      # second checkout: smoke-data-fetch skips unless code changed.
      code: ${{ steps.changes.outputs.code }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # PR file-policy checks compare the exact base and head commits.
          fetch-depth: 0

      - name: Reject conflict markers
        run: |
          if git grep -nE '^(<<<<<<< |>>>>>>> )' HEAD --; then
            echo "::error::Tracked files contain unresolved git conflict markers"
            exit 1
          fi

      - name: Tavily credit-ledger unit tests
        # Always runs (no path gate) so the hard-budget guardrail's assertions
        # are enforced on every PR and master push — a skills-only change must
        # not skip them. Pure Node, no deps; Node is preinstalled on the runner.
        run: node skills/tavily-search/lib/ledger.test.mjs

      - name: Tavily search degrade tests
        # Guards the fail-safe: a Tavily runtime failure must exit 0 (graceful
        # degrade), never a non-zero that reds the whole cron. Offline + pure Node.
        run: node skills/tavily-search/scripts/search.test.mjs

      - name: Dependency review
        # #784 gave Dependabot the pip and npm trees, but that only reports
        # AFTER a dependency is on master. This is the PR-time half: GitHub's
        # own action reads the dependency diff and objects to a newly introduced
        # known-vulnerable package, or one whose licence the project cannot take.
        #
        # Deliberately advisory (`continue-on-error`) and deliberately NOT a
        # required check. Its red is decided by the outside world — a CVE
        # disclosed this morning against a dependency nobody touched — not by
        # the diff under review. Making that block every PR is how a gate turns
        # into something people route around. Start at `high`, watch what it
        # actually catches, tighten later with data.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: false

      - name: PR file safety policy
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA")
          bad=()
          for f in "${files[@]}"; do
            case "$f" in
              .api_keys|*/.api_keys|.openclaw/*|*/.openclaw/*|.clawhub/*|*/.clawhub/*|memory/.dreams/*|memory/.tmp/*)
                bad+=("$f")
                ;;
              *.png|*.jpg|*.jpeg)
                [[ "$f" == site/assets/* || "$f" == docs/* ]] || bad+=("$f")
                ;;
            esac
          done
          if ((${#bad[@]})); then
            printf '::error::Forbidden PR path: %s\n' "${bad[@]}"
            exit 1
          fi
          echo "PR file policy OK: ${#files[@]} changed paths"

      - name: Detect code changes
        # Scope the heavy Python steps to what a PR actually touches. This job
        # (and the required `validate` context) always runs; a docs/markdown-only
        # PR just skips the expensive steps and still reports green in seconds.
        # We must NOT path-filter the pull_request trigger itself: a required
        # check that is filtered out never reports and blocks the PR forever —
        # the same trap that keeps `lint` unfiltered on PRs. Skipped *steps*
        # count as success, so we gate here. Runs on pushes too (#750): it used
        # to be PR-only, and the browser/plugin lanes were then unreachable on
        # master (measured hole, run 31059122903).
        #
        # The classification lives in ops/ci/push_scope.py — one classifier for
        # all three gates (this detector, the lint scope, the CodeQL push
        # gate), unit-tested against synthetic file lists instead of three
        # inline copies that could drift apart again. It keeps itself in sync
        # with the `push:` trigger `paths:` above via
        # test_ci_trigger_paths.py: a trigger path whose files no lane claims
        # is a gate that skips itself (#750 proved that claim false once).
        # Undiffable ranges (schedule, dispatch, brand-new ref) come back as
        # "everything changed" — running the whole suite is the safe direction.
        id: changes
        env:
          # A PR compares its own base and head. A push compares the range it
          # pushed.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 ops/ci/push_scope.py --base "$BASE_SHA" --head "$HEAD_SHA" \
            | tee -a "$GITHUB_OUTPUT"

      # The browser build is ~150MB downloaded from scratch on every UI run.
      # The composite owns the version pin and the cache key — the same key the
      # weekly screenshot-refresh uses, so whichever of the two runs first in a
      # week pays the download and the other one hits.
      - name: Set up Playwright for the browser contract
        if: steps.changes.outputs.ui == 'true'
        uses: ./.github/actions/clawock-playwright

      # The dashboard's four outputs and two sidecars live on the data branch,
      # not on master (#314), so a checkout does not carry them. The browser
      # contract loads the real page and would time out waiting for a Hero that
      # never receives its projection.
      - name: Fetch the published generation
        if: steps.changes.outputs.ui == 'true'
        run: python3 ops/pages/fetch_data_plane.py

      - name: Browser contract — Hero, detail tabs, and chart gestures
        if: steps.changes.outputs.ui == 'true'
        run: node tests/dashboard_tab_runtime.spec.js

      - name: Set up Node for Decision Studio plugin contract
        if: steps.changes.outputs.dsplugin == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          # The package has a committed lockfile, so the npm content cache is
          # keyed on it — the reproducibility gate below reinstalls the same
          # dependency set every run.
          cache: npm
          cache-dependency-path: examples/dsh/packages/clawock-dsh/package-lock.json

      # The committed lib/ is what CI and the live DSH profile consume, so it
      # has to be a function of src/ alone — not of whoever last remembered to
      # run `npm run build`. The build is reproducible by construction (the CSS
      # class hash and the bundler's region paths are both package-relative),
      # so a rebuild here must produce a byte-identical tree.
      - name: Decision Studio artifacts match their sources (rebuild is a no-op)
        if: steps.changes.outputs.dsplugin == 'true'
        env:
          # Same runner hardening as the npm publish job (#732): a lockfile
          # regenerated behind a mirror registry stalls every fetch here and
          # npm exits with its own `Exit handler never called!`, which reads as
          # "the build is broken" and is not. Observed on this very step.
          NODE_OPTIONS: --dns-result-order=ipv4first
          NO_UPDATE_NOTIFIER: '1'
          npm_config_replace_registry_host: 'always'
        run: |
          set -euo pipefail
          (
            cd examples/dsh/packages/clawock-dsh
            npm install --include=dev --no-audit --no-fund
            npm run build
          )
          git diff --exit-code -- examples/dsh/packages/clawock-dsh/lib || {
            echo "::error::examples/dsh/packages/clawock-dsh/lib is stale — run 'npm run build' in the package and commit the result"
            exit 1
          }

      - name: Decision Studio plugin contract (scan + client bundle registration)
        if: steps.changes.outputs.dsplugin == 'true'
        run: node tests/decision_studio_plugin.spec.js

      # The spec above imports lib/ out of the checkout, where the repo's own
      # node_modules satisfies everything — so it stayed green while #708
      # shipped an undeclared-at-the-install-site `zod` and crash-looped dsh in
      # production. This gate packs and installs the package standalone, which
      # is the only place that class of defect is visible.
      - name: Decision Studio package contract (standalone install + export entries)
        if: steps.changes.outputs.dsplugin == 'true'
        run: node tests/dsh_plugin_package_contract.mjs

      # numpy is required to *collect* tests/, not just to run one of them:
      # portfolio_risk_metrics imports it at module level, so without it pytest
      # aborts the whole run with a collection error and all 78 tests silently
      # stop being enforced — a green-looking local run hides this completely.
      # Pillow: validate_sidecars now fully-decodes screenshots/GIF (finding #12);
      # the real asset checks run in screenshot-refresh.yml (which has Pillow) but
      # the unit tests here exercise the same validators, so pytest needs it too.
      - name: Set up clawock (Python)
        if: steps.changes.outputs.code == 'true'
        uses: ./.github/actions/clawock-python
        with:
          install: '.[test]'

      - name: Unit tests — money-integrity derivations
        if: steps.changes.outputs.code == 'true'
        run: |
          python3 -m pytest tests/ -q \
            --cov=clawock.publish.dashboard \
            --cov=clawock.evaluation \
            --cov=clawock.harness \
            --cov=clawock.automation \
            --cov=ops \
            --cov=clawock.market_data.integrity \
            --cov=clawock.market_data.macro \
            --cov=clawock.market_data.mover_evidence \
            --cov=clawock.market_data.sentiment \
            --cov=clawock.context.brief \
            --cov=clawock.decision.packet \
            --cov=clawock.evidence.build_evidence \
            --cov=clawock.decision.ledger \
            --cov=clawock.decision.earnings \
            --cov=clawock.decision.entry \
            --cov=clawock.portfolio.fx \
            --cov=clawock.instruments \
            --cov=clawock.json_repair \
            --cov=clawock.evidence.news_evidence_graph \
            --cov=clawock.provenance \
            --cov=clawock.portfolio.realized \
            --cov=clawock.portfolio.aggregates \
            --cov=clawock.portfolio.cash \
            --cov=clawock.portfolio.math \
            --cov=clawock.portfolio.risk \
            --cov=clawock.portfolio.integrity \
            --cov=clawock.decision.risk \
            --cov=clawock.safe_io \
            --cov=clawock.evidence.research_surface \
            --cov=clawock.portfolio.snapshots \
            --cov=clawock.decision.shadow \
            --cov=clawock.decision.theses \
            --cov=clawock.sessions \
            --cov=clawock.publish.artifacts \
            --cov-report=term-missing:skip-covered \
            --cov-report=json:coverage-report.json

      - name: Coverage floors
        # Fails the PR when coverage drops below its floors — the badge is only a
        # readout, this is the part that holds. Runs on PRs too (not just the
        # publish job) so a regression is caught before merge, not after.
        if: steps.changes.outputs.code == 'true'
        run: python3 ops/ci/coverage_badge.py --report coverage-report.json --check-only

      - name: Upload coverage report
        # The suite is measured once, here. publish-coverage consumes this artifact
        # instead of running the tests again, so the published badge is the same
        # number this job gated on — not a second, independently drifting
        # measurement. Only master pushes have a consumer; PR runs skip the upload.
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report.json
          retention-days: 1

      - name: Generated cron docs match contract
        if: steps.changes.outputs.code == 'true'
        run: python3 ops/host/generate_cron_docs.py --check

      - name: Backtest claims cite a run card that still matches
        # A stale citation is the failure that matters: it points at real
        # evidence which no longer says what the claim says, so it reads as
        # maximally credible while being wrong.
        if: steps.changes.outputs.code == 'true'
        run: clawock claim-provenance --check

      - name: Validate research lifecycle artifacts
        # Every thesis, earnings and entry-gate artifact on disk must still be
        # valid — including that a gate's stated verdict matches the recomputed
        # one. Work items (a due earnings review, an ungated position) only warn
        # in system_check; this step fails on integrity alone.
        if: steps.changes.outputs.code == 'true'
        run: clawock research --check

      - name: Import-check all scripts
        if: steps.changes.outputs.code == 'true'
        run: |
          set -e
          find src ops site/tools -type f -name '*.py' -print0 |
          while IFS= read -r -d '' f; do
            echo "syntax check: $f"
            python3 -m py_compile "$f"
          done

      # The two Playwright tools are 22KB of JavaScript that only the weekly
      # screenshot cron executes, and it commits what they produce — so a syntax
      # error there surfaced on a Sunday, inside a job that writes to master.
      # Bare `node`: the runner ships it, same as the Tavily ledger step above.
      - name: Syntax-check the site tooling
        if: steps.changes.outputs.code == 'true'
        run: |
          set -e
          for f in site/tools/*.js; do
            echo "node --check: $f"
            node --check "$f"
          done

      - name: argparse-check harness CLIs
        if: steps.changes.outputs.code == 'true'
        run: |
          set -e
          # `timeout` is the point of this step as much as the exit code. The two
          # brief scripts used to be wrapped in `|| true`, which reads like the
          # case was handled: it is not, because `|| true` catches a non-zero
          # exit and what actually happened was a HANG. brief_preflight took no
          # arguments at all, so --help ran the whole preflight — live fetches,
          # EDGAR, Tavily — and ate the job's entire 10-minute budget, failing an
          # unrelated PR. A probe must cost nothing, and if it ever stops being
          # free this fails in seconds instead of taking the job down with it.
          for cli in report_preflight report_postflight \
                     intraday_preflight intraday_postflight \
                     brief_preflight brief_postflight; do
            timeout 30 env CLAWOCK_PROFILE=kcnyu clawock "${cli%%_*}" "${cli##*_}" --help > /dev/null \
              || { echo "::error::$cli.py --help did not exit 0 within 30s"; exit 1; }
          done
          echo "OK: all argparse parsers loadable"

      - name: Schema-validate portfolio.json
        if: steps.changes.outputs.code == 'true'
        run: |
          python3 << 'PY'
          import json, sys
          with open('portfolio.json') as f: p = json.load(f)
          assert 'portfolios' in p, 'missing top-level portfolios'
          for region in ('us_stocks', 'hk_stocks'):
              assert region in p['portfolios'], f'missing {region}'
              leg = p['portfolios'][region]
              assert isinstance(leg.get('holdings', []), list), f'{region}.holdings not list'
              for h in leg['holdings']:
                  for k in ('ticker', 'shares', 'cost_basis'):
                      assert k in h, f'{region} holding missing {k}: {h.get("ticker")}'
          print('portfolio.json: schema OK')
          PY

      - name: Schema-validate canonical instrument registry
        if: steps.changes.outputs.code == 'true'
        run: python3 -m clawock.instruments

      - name: Schema-validate memory/*-plan.json
        if: steps.changes.outputs.code == 'true'
        run: |
          python3 << 'PY'
          import json, glob
          from clawock.decision import ledger as decision_v2
          for p in sorted(glob.glob('memory/*-plan.json')):
              with open(p) as f: d = json.load(f)
              errors = decision_v2.validate_plan(d, p)
              assert not errors, f'{p}: {errors}'
              print(f'{p}: OK')
          PY

      - name: Decision v2 unit tests and ledger audit
        if: steps.changes.outputs.code == 'true'
        run: |
          python3 -m unittest discover -s tests -p 'test_decision_v2.py' -v
          python3 << 'PY'
          import json, glob
          from clawock.decision import ledger as decision_v2
          led = decision_v2.load_decisions()
          ids = [d['decision_id'] for d in led]
          dupes = len(ids) - len(set(ids))
          assert not dupes, f'{dupes} duplicate decision_id in ledger'
          errors = [f"{d['decision_id']}: {e}" for d in led for e in decision_v2.validate_decision(d)]
          assert not errors, errors[:10]
          # Every scored decision must trace back to a plan somebody authored. The
          # v1 migration fabricated 25 that did not, inflating the episode count
          # and the published curve for six weeks; each was individually valid, so
          # only this cross-check catches the class.
          # Conversation mind records (schema_version=0) are the deliberate
          # second ledger row type (docs/decision-mind-ledger.md): they carry
          # mind/emotion instead of a plan, are validated by the mind rule
          # above, and are authored by `clawock record --source <harness>`
          # (DSH/OpenClaw/Claude Code/Codex/CLI), not by a plan file. Exclude
          # every mind record from the plan-origin cross-check regardless of
          # which harness wrote it.
          authored = set()
          for p in glob.glob('memory/*-plan.json'):
              with open(p) as f:
                  authored |= {x['decision_id'] for x in (json.load(f).get('decisions') or [])}
          orphans = sorted(set(ids) - authored - {
              d['decision_id'] for d in led if d.get('schema_version') == 0})
          assert not orphans, f'{len(orphans)} ledger decisions authored by no plan: {orphans[:5]}'
          # settle must be a pure recompute from canonical bars, not a ratchet. Compare
          # settle-twice, never against the stored ledger: build_dashboard settles
          # in memory without writing back, so on disk it legitimately trails the
          # intraday snapshot and a freshness check here would just flake.
          decision_v2.settle_decisions(led)
          once = json.dumps(led, sort_keys=True)
          decision_v2.settle_decisions(led)
          assert json.dumps(led, sort_keys=True) == once, 'settle_decisions is not idempotent'
          print(f'ledger OK: {len(led)} decisions · {len({d["episode_id"] for d in led if d.get("episode_id")})} episodes · 0 orphans')
          PY

      - name: Rebuild dashboard.json and validate
        if: steps.changes.outputs.code == 'true'
        run: |
          clawock dashboard-build
          clawock validate-sidecar dashboard
          python3 << 'PY'
          import json
          with open('assets/data/decision_audit.json') as f: audit = json.load(f)
          assert audit.get('episode_backtest', {}).get('horizons', {}).get('t1'), \
              'decision_audit.json missing Reflect episode backtest'
          print('decision_audit.json: Reflect backtest OK')
          PY

      - name: Run build_dashboard sanity
        if: steps.changes.outputs.code == 'true'
        run: |
          # confirm it runs idempotently
          clawock dashboard-build
          clawock dashboard-build
          echo "OK: build_dashboard idempotent"

  publish-coverage:
    # Master only: the README badge must show what is on master, never a number
    # from an unmerged branch. PRs still get the floor gate in `validate` above.
    runs-on: ubuntu-latest
    timeout-minutes: 4
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # Serialize with the other commit-pushing workflows (job-scoped, so PR runs of
    # `validate` are never queued behind a data-write job).
    concurrency:
      group: data-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # `install: none` — no dependency install and no second test run: the
      # suite was already
      # measured in `validate`. The package validator runs from `src/` with the
      # stock runner so this cheap publishing job stays stdlib-only.
      - name: Set up clawock (Python)
        uses: ./.github/actions/clawock-python
        with:
          install: none
      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-report

      - name: Coverage floors and badge payload
        run: python3 ops/ci/coverage_badge.py --report coverage-report.json --out assets/data/coverage.json

      - name: Validate coverage badge
        # shields.io renders this file verbatim; a malformed payload would show up
        # as an "invalid" badge on the README instead of failing anything.
        run: PYTHONPATH=src python3 -m clawock validate-sidecar coverage

      - name: Commit
        # Commits only the badge payload. assets/data/coverage.json is not in this
        # workflow's `push:` paths, so publishing it cannot retrigger this job.
        env:
          CLAWOCK_PUBLISH_SSH_KEY: ${{ secrets.CLAWOCK_PUBLISH_SSH_KEY }}
        run: |
          set -euo pipefail
          pct=$(python3 -c "import json; print(json.load(open('assets/data/coverage.json'))['message'])")
          bash ops/publish/gha_commit_push.sh "coverage: $pct at $(git rev-parse --short HEAD)" assets/data/coverage.json

  smoke-data-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: validate
    # Only worth a runner when code changed: a docs-only PR used to pay a full
    # pip install plus two live FX providers for a probe that cannot be about
    # the docs. The lane answer comes from validate's detector via its job
    # output, so no second checkout is spent deciding this.
    if: needs.validate.outputs.code == 'true'
    continue-on-error: true  # data sources can be flaky; don't fail the pipeline
    steps:
      - uses: actions/checkout@v7

      - name: Set up clawock (Python)
        uses: ./.github/actions/clawock-python

      - name: FX fallback chain
        run: python3 ops/ci/smoke_fx.py

  analyze:
    # Was codeql.yml — advanced setup replacing GitHub's default (#782).
    #
    # Default setup cannot be path-filtered, and this repository pushes to
    # master ~35 times a day of which ~85% are pure data commits written by
    # automation (assets/data/**, memory/**). Measured over three days: 98
    # CodeQL runs, ~33 a day at 92-105 seconds each — about 55 minutes of
    # runner time daily spent re-analysing a byte-identical code tree, plus an
    # Actions list where the real CI results were buried under "Push on master"
    # rows.
    #
    # What is deliberately NOT filtered: the `pull_request` trigger. `Analyze
    # (actions)`, `Analyze (javascript-typescript)`, `Analyze (python)` and
    # `CodeQL` are required status checks, and a required check that is
    # filtered out never reports and blocks the PR forever. So every PR is
    # analysed in full; only the master-push lane is gated, and now by the same
    # positive path list every other lane in this file reads instead of a
    # private ignore-list — plus the data-path guard below for the handful of
    # watched-but-unanalysable files this trigger does list (portfolio.json,
    # memory plans/theses).
    #
    # The gate moved from a step to the job (#910). It used to live in two
    # `if:`s on the CodeQL steps, which meant an unanalysable push still
    # started three runners, checked out the tree and re-ran the classifier
    # just to conclude there was nothing to do — measured 6 of the last 27
    # push runs, three jobs each. Reading `lint`'s classification instead
    # skips the jobs outright.
    #
    # `always()` is required because `needs: lint` would otherwise cancel this
    # job whenever lint is skipped, and `needs.lint.result != 'success'` is the
    # fail-open half: if the classifier could not run, analyse. A gate that
    # silently drops CodeQL when its input is missing is the failure mode this
    # repository has been bitten by before — a discovery gate must fail toward
    # doing the work. test_ci_codeql_gate.py pins both halves.
    name: Analyze (${{ matrix.language }})
    needs: lint
    if: >-
      ${{ always() && (github.event_name != 'push'
          || needs.lint.result != 'success'
          || needs.lint.outputs.analysable == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same language set default setup was configured with, minus the two
          # aliases: `javascript` and `typescript` are both analysed by the
          # `javascript-typescript` extractor, and listing them separately just
          # produced duplicate work.
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Left on the default query suite on purpose: default setup ran
          # `query_suite: default`, and that change was about the trigger
          # surface, not about widening coverage. Widening the suite is a
          # separate decision with its own alert backlog.

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
