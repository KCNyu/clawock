name: Cron Health Check

# 17:17 HKT = 09:17 UTC 工作日 — 港股收盘后、美股开盘前 一窗口。
# 避开整点：GitHub 官方说明整点高负载会延迟甚至丢弃 scheduled runs。
# 报告任务对 git 产物；盘中任务对逐 slot heartbeat
# 缺漏 → workflow fail（Actions 可见；不做 README 首屏 badge）
on:
  schedule:
    - cron: '17 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100  # 需要看今日 commit history

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # The heartbeat ledger is published to the data branch, not committed
      # (#325), so it has to be fetched before the check can read it. Loud on
      # failure: a health check that silently read an absent ledger would
      # report every intraday slot as missed.
      - name: Fetch the published generation
        run: python3 ops/pages/fetch_data_plane.py

      - name: Run cron health check
        id: health
        run: |
          # CI cannot query the host's SQLite, so it consumes the tracked mirror.
          # system_check.py compares this contract with the live CLI on the host.
          python3 ops/host/cron_health_check.py \
            --jobs-file config/cron-schedules.json \
            --heartbeats-file assets/data/cron-heartbeats.json
          # On a miss this exits non-zero and remains visible in Actions. We deliberately
          # do NOT open an issue: per kcn's "no per-cron alerts" preference the daily review
          # covers it.
