name: Cron Health Check

# 17:17 HKT = 09:17 UTC, 周一至周六 — 港股收盘后、美股开盘前 一窗口。
# 周六也要跑：美股盘中盯盘-overnight 的最后六个槽（00:00–02:30 HKT, dow 6）和
# 美股收盘报告的 04:00 槽属于**周五的美股场次**（dow 掩码 2-6 正因此跨到周六），
# 健康闸按场次日（slot 本地日期 −1）判定（#955）；没有周六这一次运行，这些槽的
# heartbeat/commit 就写进 ledger 后无人核验——每周固定一个场次的两张网失明。
#
# 同理（#996）：美股开盘报告（21:30/22:30 HKT）和美股盘中盯盘晚间槽
# （22:00–23:30 HKT）落在**每一天**自己的唯一一次运行之后，同日核验永远轮不到
# 它们——每次运行同时按 verify 日=前一天核验这两个 job 的晚间产物。
#
# 这里原来写着「避开整点：GitHub 官方说明整点高负载会延迟甚至丢弃 scheduled
# runs」，隐含「非整点就准时」。**这条被本档自己的数据证伪了**（#781）：它就在
# `17 9`，20 次实测漂移 30–198 分钟、中位 71 分钟。真正决定延迟的是 **UTC 小时
# 有多拥挤**，不是分钟好不好看：`45 21` 中位 46 分钟、`0 13` 中位 74 分钟、
# `25 0` 中位 124 分钟。
#
# ⇒ 任何「靠准时才有价值」的任务都不能只靠挑一个分钟来保证（brief-fallback 就是
# 这么失效的，见 #780）。当前漂移表由 `ops/ci/schedule_drift.py` 每周采两次写进
# `assets/data/schedule-drift.json`，别再凭印象猜。
#
# 本档自身对漂移不敏感：它读的是当天已落地的 git 产物与 heartbeat，晚一小时读到
# 的是同一批事实。
# 报告任务对 git 产物（缺 commit 时再查 workflow-outcomes 是否是 Telegram backstop
# 接管——那条路径设计上不产 commit，见 #696）；盘中任务对逐 slot heartbeat
# 缺漏 → workflow fail（Actions 可见；不做 README 首屏 badge）
on:
  schedule:
    - cron: '17 9 * * 1-5'
    # Saturday: the overnight monitor's last slots and the US close report land
    # on Sat 00:00-04:00 HKT but belong to FRIDAY's session — without a weekend
    # run nobody ever verified them (#955).
    - cron: '17 9 * * 6'
  workflow_dispatch:

permissions:
  contents: read
  actions: read      # the Actions-side health fold-in reads run history via gh

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100  # 需要看今日 commit history

      # `install: none` — this job runs stdlib scripts against the fetched
      # generation and needs no package, but the Python version still gets
      # decided in exactly one place.
      - name: Set up clawock (Python)
        uses: ./.github/actions/clawock-python
        with:
          install: none

      # The heartbeat ledger is published to the data branch, not committed
      # (#325), so it has to be fetched before the check can read it. Loud on
      # failure: a health check that silently read an absent ledger would
      # report every intraday slot as missed.
      - name: Fetch the published generation
        run: python3 ops/pages/fetch_data_plane.py

      - name: Run cron health check
        id: health
        run: |
          # CI cannot query the host's SQLite, so it consumes the tracked mirror.
          # system_check.py compares this contract with the live CLI on the host.
          python3 ops/host/cron_health_check.py \
            --jobs-file config/cron-schedules.json \
            --heartbeats-file assets/data/cron-heartbeats.json \
            --outcomes-file assets/data/workflow-outcomes.json
          # On a miss this exits non-zero and remains visible in Actions. We deliberately
          # do NOT open an issue: per kcn's "no per-cron alerts" preference the daily review
          # covers it.

      - name: Fold Actions-side failures into the daily summary
        # cron_health_check only sees host-side products; a scheduled workflow
        # that fails (or stops firing) on the Actions side was previously
        # visible only in weekly-health's log-only rollup. --json is report-only
        # and needs read access to run history.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Report-only end to end: a gh hiccup here must cost a note in the
          # summary, not redden a health check that has its own verdict.
          {
            echo "## Scheduled workflow health (Actions side)"
            python3 ops/ci/workflow_health.py --json 2>/dev/null | python3 -c '
              import json, sys
              r = json.load(sys.stdin)
              print(f"needs attention: {r[\"needs_attention\"]} of {r[\"scheduled_workflows\"]} "
                    f"(lookback {r[\"lookback_days\"]}d)")
              for w in r["workflows"]:
                  if w["status"] == "attention":
                      print(f"- ⚠ {w[\"workflow\"]}: last={w[\"last_conclusion\"] or \"-\"}")
            ' || echo "(Actions-side rollup unavailable this run — see weekly-health)"
          } >> "$GITHUB_STEP_SUMMARY"
