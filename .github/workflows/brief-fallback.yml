name: Brief Fallback (off-host LLM)

# 08:25 HKT = 00:25 UTC 工作日, 晚 openclaw 25 分钟兜底
# 窗口从 5min 拉宽到 25min (2026-05-30): 主 cron 08:00 启动但 LLM 生成常要几分钟,
# 5min 太窄会在主 brief 落地前误判"没出"→重复生成→push 撞主 cron commit 的 rebase 冲突
# 如果今天的 pre-open.md 已存在（git log 只作兜底）→ skip
# 否则用远端 MiniMax（可选 Xiaomi fallback）直跑 brief
on:
  schedule:
    - cron: '25 0 * * 1-5'
  workflow_dispatch:

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 50

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - run: pip install --quiet requests numpy

      # Set git identity up front: brief_postflight commits internally (rebuild
      # dashboard + auto-commit), so it needs an identity well before the final
      # Commit+push step — otherwise it dies with "empty ident name" on the runner.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check if openclaw already ran today's brief
        id: check
        run: |
          TODAY=$(TZ=Asia/Hong_Kong date +%Y-%m-%d)
          HOUR=$(TZ=Asia/Hong_Kong date +%-H)
          echo "TODAY=$TODAY" >> "$GITHUB_ENV"
          # File truth first: the brief commits memory/{date}-pre-open.md, so its
          # presence in the checkout is depth-proof. The old git-log grep broke on
          # 2026-06-10: fetch-depth 10 + a busy morning (brief at depth 19) + 4.5h
          # GHA delay → "no brief found" → near-duplicate brief at 12:53 HKT.
          if [ -f "memory/${TODAY}-pre-open.md" ] || \
             git log --since "$TODAY 00:00" --grep "daily deep brief $TODAY" --oneline | grep -q "."; then
            echo "today's brief already exists — skip fallback"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$HOUR" -ge 10 ]; then
            # Lateness gate: a "pre-open" brief generated after HK open is stale
            # noise (intraday reports already cover the session) — never generate.
            echo "too late to be useful (hour=$HOUR HKT >= 10) — skip"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "no brief found — fallback will run"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run preflight (collect deterministic data)
        if: steps.check.outputs.skip != 'true'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python3 scripts/harness/brief_preflight.py 2>&1 | tail -50

      - name: Call off-host LLM to generate brief
        if: steps.check.outputs.skip != 'true'
        env:
          XIAOMI_API_KEY: ${{ secrets.XIAOMI_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: python3 scripts/data/gh_action_brief_fallback.py

      - name: Postflight validation
        if: steps.check.outputs.skip != 'true'
        # postflight exits 0=pass, 1=warn (both publishable), 2=fail. pass/warn keep the
        # job green; a real fail (2) blocks the commit. Exit 1 can also mean an uncaught
        # Python exception, so the next step requires the gate file that a legitimate
        # warn wrote. NOT `|| true`, which swallowed every failure into a silent publish,
        # and NOT a bare pipe, which would turn a publishable warn red under pipefail.
        run: |
          set +e
          python3 scripts/harness/brief_postflight.py > "${RUNNER_TEMP:-/tmp}/postflight.log" 2>&1
          code=$?
          tail -20 "${RUNNER_TEMP:-/tmp}/postflight.log"
          [ "$code" -lt 2 ] || exit "$code"

      - name: Commit + push
        # Reached when postflight exits <2: pass/warn, or an uncaught exception (exit 1).
        # The publish gate distinguishes a legitimate warn from a crash-before-gate;
        # missing gate fails the job, while explicit publish_ok=false publishes nothing.
        if: steps.check.outputs.skip != 'true'
        env:
          CLAWOCK_PUBLISH_SSH_KEY: ${{ secrets.CLAWOCK_PUBLISH_SSH_KEY }}
        run: |
          if [ ! -f "logs/brief_postflight_status.json" ]; then
            echo "postflight crashed before writing the publish gate (logs/brief_postflight_status.json) — refusing to publish"
            exit 1
          fi
          ok=$(python3 -c "import json;print(json.load(open('logs/brief_postflight_status.json'))['publish_ok'])" 2>/dev/null || echo "None")
          if [ "$ok" != "True" ]; then
            echo "publish gate: publish_ok=$ok — refusing to commit a non-passing (or crashed) brief"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memory/ portfolio.json assets/data/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "memory: brief-fallback (off-host-llm) $TODAY"
          fi
          # Push whenever HEAD is ahead of origin/master, NOT only on a dirty index.
          # postflight's maybe_commit already commits here, and its push can FAIL on
          # this ephemeral runner while still returning commit_ok=true; gating the
          # push on a dirty index then leaves that commit unpushed and the runner
          # discards it — green but nothing published (2026-07 audit finding #4).
          git fetch origin master -q || true
          if [ -n "$(git rev-list origin/master..HEAD 2>/dev/null)" ]; then
            bash scripts/data/safe_push.sh
          else
            echo "nothing to push — HEAD not ahead of origin/master"
          fi
