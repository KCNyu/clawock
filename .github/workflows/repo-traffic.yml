name: Measurement Capture

# Two rolling-window measurements that are lost if nobody writes them down.
#
# GitHub's Traffic API keeps 14 days. Nothing captured it until #789, so every
# week that passed permanently erased the only first-party measurement of who
# reaches this project and from where. This is the one kind of data loss that
# cannot be repaired later by trying harder.
#
# On GitHub rather than the VPS, per the standing rule for new automation (and
# kcn, 2026-08-22: nothing new on the box). Also the right host on the merits —
# the token that can read traffic is already here.
#
# Twice a week, not weekly. The window is 14 days so weekly would suffice in
# theory, but one missed run then silently costs 7 days that no retry can
# recover. Two runs, four days apart, make a single failure harmless. Minutes
# chosen off the hour and off the contended UTC hours; measured schedule drift
# in this repository is 10-160 minutes and is driven by how busy the hour is
# (#781), which for a rolling-window capture is irrelevant anyway.
on:
  schedule:
    - cron: '38 3 * * 2'
    - cron: '38 3 * * 6'
  workflow_dispatch:

# Shares the repository's single writer lane: this commits to master like every
# other data producer, and must queue behind them rather than race.
concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # `install: none` — both capture scripts are stdlib only.
      - name: Set up clawock (Python)
        uses: ./.github/actions/clawock-python
        with:
          python-version: '3.12'
          install: none

      - name: Capture traffic and package downloads
        id: traffic
        # Two perishable measurements share this job, and neither may be lost to
        # the other's failure. `repo_traffic.py` already honours that rule
        # internally — a registry outage still writes the GitHub half
        # (`test_package_downloads_are_advisory_and_never_lose_the_github_half`)
        # — while the YAML around it did the opposite: `set -euo pipefail` plus a
        # commit step with no `if` meant a failure in either capture threw away
        # whatever the other one had already merged. Both 2026-08 failures
        # (runs 32550935688, 32619875646) died in this step, so the drift
        # capture never ran at all.
        continue-on-error: true
        env:
          # The Traffic API does not answer to GITHUB_TOKEN — it only takes a
          # PAT/OAuth token with repo scope (measured 2026-08-23: the workflow
          # token got 403 on every run since the first schedule, #843).
          GITHUB_TOKEN: ${{ secrets.REPO_METRICS_TOKEN }}
        run: |
          set -euo pipefail
          python3 ops/growth/repo_traffic.py | tee /tmp/traffic.txt
          {
            echo '### Repository traffic'
            echo '```'
            cat /tmp/traffic.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Measure how late GitHub delivers the scheduled workflows
        id: drift
        continue-on-error: true
        # Every scheduled workflow in this repository is late and nobody kept a
        # number (#781). The Actions API ages runs out too, so this is the same
        # shape of perishable measurement as the traffic above — and the numbers
        # it produces are what a scheduling decision has to be argued from
        # instead of a nice-looking cron minute.
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_METRICS_TOKEN }}
        run: |
          set -euo pipefail
          python3 ops/ci/schedule_drift.py | tee /tmp/drift.txt
          {
            echo '### Scheduled-run drift'
            echo '```'
            cat /tmp/drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compose the commit message
        run: |
          echo "COMMIT_MESSAGE=measurement: repo traffic + schedule drift $(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Commit the merged history
        # Whatever did land. A capture that failed leaves its file untouched, so
        # this commits the half that succeeded rather than discarding it — and
        # it runs before the verdict below, so the data is safe even as the run
        # goes red.
        env:
          CLAWOCK_PUBLISH_SSH_KEY: ${{ secrets.CLAWOCK_PUBLISH_SSH_KEY }}
        uses: ./.github/actions/clawock-commit
        with:
          paths: assets/data/repo-traffic.json assets/data/schedule-drift.json
          message: ${{ env.COMMIT_MESSAGE }}

      # `continue-on-error` above keeps one capture's failure from erasing the
      # other's data — it must not also make the failure invisible. A scheduled
      # workflow that fails silently is what left news-digest red for three days
      # in July 2026 (see weekly-health's rollup); the run has to end red so the
      # rollup can name it.
      - name: A capture that failed still fails the run
        if: steps.traffic.outcome == 'failure' || steps.drift.outcome == 'failure'
        run: |
          echo "traffic=${{ steps.traffic.outcome }} drift=${{ steps.drift.outcome }}" >&2
          exit 1
