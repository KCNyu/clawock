name: EOD Market Archive

# Friday 22:00 UTC (= Saturday 06:00 HKT, post-US-close), append week's closing prices
# for all active tickers to a long-form CSV. This is the audit trail that survives
# even if portfolio.json gets corrupted — pure read-only historical record.
on:
  schedule:
    - cron: '0 22 * * 5'
  workflow_dispatch:

# Serialize with other commit-pushing workflows
concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - run: pip install --quiet requests

      - name: Append week-end snapshot
        run: |
          mkdir -p memory/archive
          python3 << 'PY'
          import json, csv, os
          from datetime import date

          p = json.load(open('portfolio.json'))
          rows = []
          for region in ('us_stocks', 'hk_stocks'):
              leg = p['portfolios'].get(region, {})
              cur = 'USD' if region == 'us_stocks' else 'HKD'
              for h in leg.get('holdings', []):
                  if h.get('shares', 0) > 0:
                      rows.append({
                          'date': str(date.today()),
                          'ticker': h['ticker'],
                          'name': h.get('name',''),
                          'currency': cur,
                          'shares': h.get('shares', 0),
                          'cost_basis': h.get('cost_basis', 0),
                          'current_price': h.get('current_price', 0),
                          'pnl_pct': h.get('pnl_percent', 0),
                          'current_value': h.get('current_value', 0),
                      })

          if not rows:
              print('no active holdings — nothing to archive'); raise SystemExit(0)
          fpath = 'memory/archive/eod-history.csv'
          new = not os.path.exists(fpath)
          with open(fpath, 'a', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=list(rows[0].keys()))
              if new: w.writeheader()
              w.writerows(rows)
          print(f'appended {len(rows)} rows to {fpath}')
          PY

      - name: Validate EOD archive coverage
        run: |
          python3 << 'PY'
          import csv
          import math
          import sys
          from datetime import date
          from pathlib import Path

          path = Path('memory/archive/eod-history.csv')
          assert path.is_file(), f'EOD archive missing: {path}'
          expected_fields = (
              'date', 'ticker', 'name', 'currency', 'shares', 'cost_basis',
              'current_price', 'pnl_pct', 'current_value',
          )
          with path.open(newline='', encoding='utf-8') as handle:
              reader = csv.DictReader(handle)
              assert tuple(reader.fieldnames or ()) == expected_fields, (
                  f'EOD archive schema mismatch: {reader.fieldnames}')
              rows = list(reader)

          snapshot_date = str(date.today())
          today_rows = [row for row in rows if row['date'] == snapshot_date]
          assert today_rows, f'EOD archive has no rows for {snapshot_date}'
          for index, row in enumerate(today_rows, start=1):
              ticker = row.get('ticker')
              if not isinstance(ticker, str) or not ticker.strip():
                  print(
                      f'ASSERTION FAILED: EOD archive {path}: malformed row {index} '
                      f'for {snapshot_date}: ticker missing',
                      file=sys.stderr,
                  )
                  raise SystemExit(1)
          keys = [(row['ticker'], row['currency']) for row in today_rows]
          assert len(keys) == len(set(keys)), f'duplicate EOD rows for {snapshot_date}'

          def finite_number(value):
              try:
                  return math.isfinite(float(value))
              except (TypeError, ValueError):
                  return False

          for row in today_rows:
              assert row['currency'] in ('USD', 'HKD'), (
                  f"unexpected EOD currency for {row['ticker']}: {row['currency']}")
              for field in ('shares', 'cost_basis', 'current_price', 'current_value'):
                  assert finite_number(row[field]) and float(row[field]) > 0, (
                      f"invalid EOD {field} for {row['ticker']}: {row[field]!r}")
              assert finite_number(row['pnl_pct']), (
                  f"invalid EOD pnl_pct for {row['ticker']}: {row['pnl_pct']!r}")
          print(f'EOD archive coverage validation OK: {len(today_rows)} rows for {snapshot_date}')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memory/archive/
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "archive: EOD snapshot $(date -u +%Y-W%W)"
          bash scripts/data/safe_push.sh
