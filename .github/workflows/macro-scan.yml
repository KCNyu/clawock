name: Macro Scan

# 21:45 UTC Sun–Thu = 05:45 HKT Mon–Fri, ~2.25h before the 08:00 HKT (00:00 UTC) brief.
# WHY this early (not 15 min before): GH Action scheduled crons routinely fire 1–2h
# LATE, so a job nominally "just before the brief" used to actually run AFTER it
# (2026-05-30: macro nominally 07:45 HKT ran 09:30 HKT → brief got yesterday's macro).
# 21:xx UTC gives a delay-absorbing buffer while still being after the US close even in
# winter EST (16:00 EST = 21:00 UTC; summer EDT close = 20:00 UTC).
# dow is 0-4 (NOT 1-5): cron is UTC and 21:45+8h wraps to the NEXT HKT day, so 1-5 would
# fire Tue–Sat HKT and miss Monday. Verify any change with: bash ops/host/check_crons.sh --timeline
# VIX / 10Y yield / DXY / Fear & Greed / major indices snapshot.
# Free public APIs, no key. Writes assets/data/macro.json — consumed by brief preflight.
on:
  schedule:
    - cron: '45 21 * * 0-4'
    # Second attempt (brief-fallback multi-tier pattern): measured drift
    # (assets/data/schedule-drift.json, n=20) maxes at 199min against this
    # slot's ~135min pre-brief buffer — the same "brief read yesterday's
    # sidecar" window sentiment has. Idempotent overwrite; an already-fresh
    # retry costs a no-op commit step.
    - cron: '55 21 * * 0-4'
  workflow_dispatch:

# Serialize with other commit-pushing workflows
concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up clawock (Python)
        uses: ./.github/actions/clawock-python

      - name: Fetch macro
        run: clawock macro --workspace .

      - name: Validate macro coverage
        run: clawock validate-sidecar macro

      - name: Snapshot point-in-time copy
        # factor-snapshots/ keeps a verbatim dated copy of every sidecar
        # generation (#936): the live file is overwritten in place, so any
        # later factor research reading it would see today's data, not what
        # the day's decisions actually saw. Research reads the dated row.
        run: python3 ops/ci/snapshot_factor_sidecar.py --source assets/data/macro.json

      - name: Commit
        # Shared helper commits only this workflow's sidecar. The frontend fetches
        # it directly; dashboard.json is not rebuilt for it.
        env:
          CLAWOCK_PUBLISH_SSH_KEY: ${{ secrets.CLAWOCK_PUBLISH_SSH_KEY }}
        run: |
          bash ops/publish/gha_commit_push.sh \
            "macro: daily snapshot $(date -u +%Y-%m-%d)" \
            assets/data/macro.json \
            assets/data/factor-snapshots/macro
