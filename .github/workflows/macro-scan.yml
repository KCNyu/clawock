name: Macro Scan

# 21:45 UTC Sun–Thu = 05:45 HKT Mon–Fri, ~2.25h before the 08:00 HKT (00:00 UTC) brief.
# WHY this early (not 15 min before): GH Action scheduled crons routinely fire 1–2h
# LATE, so a job nominally "just before the brief" used to actually run AFTER it
# (2026-05-30: macro nominally 07:45 HKT ran 09:30 HKT → brief got yesterday's macro).
# 21:xx UTC gives a delay-absorbing buffer while still being after the US close even in
# winter EST (16:00 EST = 21:00 UTC; summer EDT close = 20:00 UTC).
# dow is 0-4 (NOT 1-5): cron is UTC and 21:45+8h wraps to the NEXT HKT day, so 1-5 would
# fire Tue–Sat HKT and miss Monday. Verify any change with: ./check_crons.sh --timeline
# VIX / 10Y yield / DXY / Fear & Greed / major indices snapshot.
# Free public APIs, no key. Writes assets/data/macro.json — consumed by brief preflight.
on:
  schedule:
    - cron: '45 21 * * 0-4'
  workflow_dispatch:

# Serialize with other commit-pushing workflows
concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - run: pip install --quiet requests

      - name: Fetch macro
        run: python3 scripts/data/fetch_macro.py

      - name: Validate macro coverage
        run: |
          python3 << 'PY'
          import json
          import math
          from datetime import datetime
          from pathlib import Path

          path = Path('assets/data/macro.json')
          assert path.is_file(), f'macro snapshot missing: {path}'
          data = json.loads(path.read_text(encoding='utf-8'))
          generated_at = data.get('generated_at')
          assert isinstance(generated_at, str), 'macro generated_at missing'
          datetime.fromisoformat(generated_at.replace('Z', '+00:00'))

          def finite_number(value):
              return (isinstance(value, (int, float))
                      and not isinstance(value, bool) and math.isfinite(value))

          quote_fields = ('vix', 'treasury_10y', 'dxy', 'hsi', 'hstech', 'spx', 'nasdaq')
          successful = [
              field for field in quote_fields
              if isinstance(data.get(field), dict)
              and finite_number(data[field].get('price'))
              and isinstance(data[field].get('source'), str)
              and data[field]['source'].strip()
          ]
          fear_greed = data.get('fear_greed')
          if isinstance(fear_greed, dict) and finite_number(fear_greed.get('score')):
              successful.append('fear_greed')
          fed_press = data.get('fed_press')
          if (isinstance(fed_press, list)
                  and any(isinstance(item, dict) and str(item.get('title', '')).strip()
                          for item in fed_press)):
              successful.append('fed_press')

          assert successful, 'macro snapshot has zero successfully populated fields'
          print(f'macro coverage validation OK: {", ".join(successful)}')
          PY

      - name: Commit
        # Shared helper commits only this workflow's sidecar. The host's single
        # publisher folds it into dashboard.json on the next <=20-minute tick.
        run: |
          bash scripts/data/gha_commit_push.sh "macro: daily snapshot $(date -u +%Y-%m-%d)" assets/data/macro.json
