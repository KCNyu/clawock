version: 2

# Dependabot PRs are merged from Dependabot's own branch. The master ruleset
# requires no approving review, and the required checks (`validate`, `lint`,
# `Analyze (actions)`, `Analyze (javascript-typescript)`, `Analyze (python)`,
# `CodeQL`) run and report on its PRs like on any other: #894-#897, #1508,
# #1711, #2079, #2578 and #3188 were squash-merged that way. That has held
# since #797 (2026-08-22) moved CodeQL from default setup to the workflow that
# is now in ci.yml; under default setup the `Analyze (...)` contexts never
# started on a Dependabot PR, which is why #3 and #116 had to be reopened.
#
# The one case that still needs a `claude/…` or `codex/…` branch is an npm
# bump that changes clawock-dsh's built `lib/client.js`: `validate` fails with
# "lib is stale" and Dependabot cannot rebuild it (#3078, redone as #3082).
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    # Minor and patch bumps share one grouped PR; each major bump gets its own.
    # The most this entry has opened in one run is three (#116-#118, #274-#276),
    # so 5 has never held a PR back and still caps a burst of majors.
    open-pull-requests-limit: 5
    groups:
      safe-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # `pyproject.toml` is the one place the Python dependencies are declared (they
  # used to be drifting `pip install` lines in nine workflows). Until #784 this
  # file claimed the repository had no Python manifest at all, so the dependency
  # surface of the package published to PyPI was watched by nobody — and
  # repository-level Dependabot security updates only produce alerts for trees
  # an ecosystem entry makes visible.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    # Never reached: every requirement in pyproject.toml is a `>=` floor with no
    # upper cap, and the weekly pip run has opened no PR since this entry was
    # added (#791, 2026-08-22). 3 leaves room for the grouped minor/patch PR
    # plus two major bumps at once, which nothing here has come close to.
    open-pull-requests-limit: 3
    groups:
      python-safe:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The npm side of the release train. clawock-dsh ships a full lockfile and has
  # already broken a release once through it (0.1.6: mirror-registry URLs left in
  # `resolved`), so this tree is not hypothetical.
  - package-ecosystem: npm
    directory: /examples/dsh/packages/clawock-dsh
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      npm-safe:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
